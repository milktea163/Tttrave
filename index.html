<script>
/* V59: 行きたい度だけでなく「近さ・周辺県・旅行全体の負担」を考慮して旅程を作る */
(function(){
  const ADJ={
    '北海道':['青森県'],
    '青森県':['北海道','岩手県','秋田県'],
    '岩手県':['青森県','秋田県','宮城県'],
    '宮城県':['岩手県','秋田県','山形県','福島県'],
    '秋田県':['青森県','岩手県','宮城県','山形県'],
    '山形県':['秋田県','宮城県','福島県','新潟県'],
    '福島県':['宮城県','山形県','新潟県','群馬県','栃木県','茨城県'],
    '茨城県':['福島県','栃木県','埼玉県','千葉県'],
    '栃木県':['福島県','群馬県','埼玉県','茨城県'],
    '群馬県':['福島県','新潟県','長野県','埼玉県','栃木県'],
    '埼玉県':['群馬県','栃木県','茨城県','千葉県','東京都','山梨県','長野県'],
    '千葉県':['茨城県','埼玉県','東京都','神奈川県'],
    '東京都':['埼玉県','千葉県','神奈川県','山梨県'],
    '神奈川県':['東京都','山梨県','静岡県','千葉県'],
    '新潟県':['山形県','福島県','群馬県','長野県','富山県'],
    '富山県':['新潟県','長野県','岐阜県','石川県'],
    '石川県':['富山県','福井県','岐阜県'],
    '福井県':['石川県','岐阜県','滋賀県','京都府'],
    '山梨県':['東京都','神奈川県','埼玉県','長野県','静岡県'],
    '長野県':['新潟県','群馬県','埼玉県','山梨県','静岡県','愛知県','岐阜県','富山県'],
    '岐阜県':['富山県','石川県','福井県','長野県','愛知県','三重県','滋賀県'],
    '静岡県':['山梨県','神奈川県','長野県','愛知県'],
    '愛知県':['長野県','岐阜県','静岡県','三重県'],
    '三重県':['愛知県','岐阜県','滋賀県','京都府','奈良県','和歌山県'],
    '滋賀県':['福井県','岐阜県','三重県','京都府'],
    '京都府':['福井県','滋賀県','大阪府','兵庫県','奈良県','三重県'],
    '大阪府':['京都府','兵庫県','奈良県','和歌山県'],
    '兵庫県':['京都府','大阪府','鳥取県','岡山県'],
    '奈良県':['京都府','大阪府','三重県','和歌山県'],
    '和歌山県':['大阪府','奈良県','三重県'],
    '鳥取県':['兵庫県','岡山県','島根県'],
    '島根県':['鳥取県','岡山県','広島県','山口県'],
    '岡山県':['兵庫県','鳥取県','島根県','広島県','香川県'],
    '広島県':['岡山県','島根県','山口県','愛媛県'],
    '山口県':['島根県','広島県','福岡県'],
    '徳島県':['香川県','愛媛県','高知県'],
    '香川県':['岡山県','徳島県','愛媛県'],
    '愛媛県':['香川県','徳島県','高知県','広島県'],
    '高知県':['徳島県','愛媛県'],
    '福岡県':['山口県','佐賀県','熊本県','大分県'],
    '佐賀県':['福岡県','長崎県'],
    '長崎県':['佐賀県'],
    '熊本県':['福岡県','大分県','宮崎県','鹿児島県'],
    '大分県':['福岡県','熊本県','宮崎県'],
    '宮崎県':['大分県','熊本県','鹿児島県'],
    '鹿児島県':['熊本県','宮崎県'],
    '沖縄県':[]
  };
  function neighbors(pref){return ADJ[pref]||[]}
  function hop(pref,target){if(pref===target)return 0;const q=[[pref,0]],seen=new Set([pref]);while(q.length){const [p,d]=q.shift();for(const n of neighbors(p)){if(seen.has(n))continue;if(n===target)return d+1;seen.add(n);q.push([n,d+1])}}return 99}
  function prefFromDestination(dest){
    const d=String(dest||'').trim();
    if(typeof PREF!=='undefined'&&PREF.includes(d))return d;
    if(typeof PREF!=='undefined'){const f=PREF.find(p=>d.includes(p.replace(/都|府|県$/,'')));if(f)return f}
    return '';
  }
  function distanceKm(a,b){
    if(!(a?.lat&&a?.lon&&b?.lat&&b?.lon))return null;
    const R=6371,rad=Math.PI/180,lat1=+a.lat*rad,lat2=+b.lat*rad,dLat=(+b.lat-+a.lat)*rad,dLon=(+b.lon-+a.lon)*rad;
    const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
  }
  function scoreSpot(s,main,lastPref,focus){
    const p=String(s.prefecture||'');const h=hop(main,p);let score=(Number(s.priority)||3)*18;
    if(h===0)score+=42;else if(h===1)score+=28;else if(h===2)score+=8;else score-=24;
    if(lastPref){const lh=hop(lastPref,p);if(lh===0)score+=18;else if(lh===1)score+=9;else if(lh>=3)score-=12}
    if(focus==='near')score+=h===0?35:h===1?24:h===2?5:-20;
    if(focus==='priority')score+=(Number(s.priority)||3)*5;
    return score;
  }
  function selectBalanced(favs,t,settings){
    const main=prefFromDestination(t.destination);
    const pool=favs.filter(s=>s.favorite);
    const focus=settings.focus||'balanced';
    const allow=settings.includeNearby!==false;
    const filtered=pool.filter(s=>{const h=hop(main,String(s.prefecture||''));return !main||h<= (allow?2:0) || (Number(s.priority)||0)>=5});
    let remaining=[...filtered],out=[],lastPref=main;
    while(remaining.length){
      let best=remaining[0],bestScore=-Infinity;
      for(const s of remaining){const sc=scoreSpot(s,main,lastPref,focus);if(sc>bestScore){best=s;bestScore=sc}}
      out.push(best);remaining=remaining.filter(x=>x.id!==best.id);lastPref=best.prefecture||lastPref;
    }
    return {ordered:out,main,allCount:pool.length,usedCount:out.length,nearbyCount:out.filter(s=>main&&hop(main,String(s.prefecture||''))===1).length};
  }
  function dates(t){if(typeof tripDates==='function')return tripDates(t);if(!t?.startDate||!t?.endDate)return[t?.startDate||today()];const a=[];let d=new Date(t.startDate+'T00:00:00'),e=new Date(t.endDate+'T00:00:00');while(d<=e&&a.length<30){a.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return a}
  function openConciergeV59(){
    const t=trip();if(!t){openTripModal();toast('まず旅行を作成してください');return}
    const fav=data.spots.filter(s=>s.favorite),main=prefFromDestination(t.destination),near=main?neighbors(main):[];
    openModal(`<div class="modal-head"><h2>✨ 旅行コンシェルジュ</h2><button class="close" onclick="closeModal()">×</button></div>
      <div class="concierge-box"><h3>${esc(t.name)}</h3><p class="small">📍 ${esc(t.destination||'行き先未定')} ／ 📅 ${esc(t.startDate||'未定')} ～ ${esc(t.endDate||'未定')}</p><p class="small">⭐ 行きたい ${fav.length}か所 ${main?`／ 中心：${esc(main)}`:''}</p><div class="one-line">💡 星の数だけでなく、同じ県・近隣県・移動のまとまりを考えて、無理のない旅程を作ります。</div></div>
      <div class="group"><label>旅行のペース</label><div class="choice-row" id="paceChoices"><button class="choice on" data-v="relaxed" onclick="selectChoice(this,'paceChoices')">ゆったり</button><button class="choice" data-v="standard" onclick="selectChoice(this,'paceChoices')">標準</button><button class="choice" data-v="active" onclick="selectChoice(this,'paceChoices')">たくさん回る</button></div></div>
      <div class="group"><label>重視すること</label><div class="choice-row" id="focusChoices"><button class="choice on" data-v="balanced" onclick="selectChoice(this,'focusChoices')">⭐近さ＋行きたい度</button><button class="choice" data-v="priority" onclick="selectChoice(this,'focusChoices')">⭐行きたい度を優先</button><button class="choice" data-v="near" onclick="selectChoice(this,'focusChoices')">📍近さを優先</button></div></div>
      <div class="group"><label>移動手段</label><select id="conciergeTransport" class="field"><option value="車">🚗 車</option><option value="電車・バス">🚆 電車・バス</option><option value="徒歩中心">🚶 徒歩中心</option><option value="未設定">未設定</option></select></div>
      <div class="group"><label>旅で重視したいこと（複数選択）</label><div class="choice-row" id="interestChoices"><button type="button" class="choice on" data-v="観光" onclick="toggleMultiChoice(this)">🏞️ 観光</button><button type="button" class="choice" data-v="グルメ" onclick="toggleMultiChoice(this)">🍴 グルメ</button><button type="button" class="choice" data-v="カフェ" onclick="toggleMultiChoice(this)">☕ カフェ</button><button type="button" class="choice" data-v="自然" onclick="toggleMultiChoice(this)">🌿 自然</button></div></div>
      <div class="group"><label>食事</label><select id="conciergeMeal" class="field"><option value="自由に選ぶ">自由に選ぶ</option><option value="ご当地グルメ重視">ご当地グルメ重視</option><option value="カフェを入れたい">カフェを入れたい</option><option value="節約したい">できるだけ節約</option></select></div>
      <div class="group"><label>1日の希望</label><input id="conciergeNote" class="field" maxlength="100" placeholder="例：朝はゆっくり、夕方にはホテルへ戻りたい"></div>
      <div class="v59-smart"><b>🗺️ 近隣県も旅程候補にする</b><label class="v59-toggle"><input id="v59IncludeNearby" type="checkbox" checked><span><strong>同じ県だけに固定しない</strong><div class="v59-note">${main?`${esc(main)}を中心に、${esc(near.slice(0,5).join('・')||'近隣県')}などの「行きたい」スポットも検討します。`:'旅行先が都道府県として設定されている場合、近隣県も検討します。'} 星が少なくても近くにまとまる場所は候補に入り、遠すぎる高評価スポットは無理に詰め込みません。</div></span></label></div>
      ${!fav.length?'<div class="warning">まず「行きたい場所」を登録してください。</div>':''}
      ${!t.startDate||!t.endDate?'<div class="warning">旅行の日程を設定すると、1日ごとに近い場所をまとめて配置できます。</div>':''}
      <button class="btn full" onclick="runConcierge()">✨ 近さも考えて旅程を作る</button>`);
  }
  function runConciergeV59(){
    const t=trip();if(!t)return;const fav=data.spots.filter(s=>s.favorite);if(!fav.length){closeModal();switchPage('explore');toast('まず行きたい場所をお気に入り登録してください');return}
    const pace=selectedChoice('paceChoices')||'relaxed',focus=selectedChoice('focusChoices')||'balanced',transport=document.getElementById('conciergeTransport')?.value||'未設定',interests=selectedMultiChoices('interestChoices'),meal=document.getElementById('conciergeMeal')?.value||'自由に選ぶ',note=document.getElementById('conciergeNote')?.value.trim()||'',includeNearby=document.getElementById('v59IncludeNearby')?.checked!==false;
    const picked=selectBalanced(fav,t,{focus,includeNearby}),ordered=picked.ordered,perDay=pace==='relaxed'?2:pace==='active'?5:3,ds=dates(t);t.plans=t.plans||[];let added=0;const usedPrefByDay={};
    ordered.forEach((s,i)=>{if(t.plans.some(p=>p.spotId===s.id))return;const day=Math.min(Math.floor(added/perDay),ds.length-1),date=ds[day];const dayItems=t.plans.filter(p=>p.date===date);const times=pace==='relaxed'?['10:00','15:00']:pace==='active'?['08:30','10:30','13:00','15:30','18:00']:['09:30','13:00','16:00'];const time=times[Math.min(dayItems.length,times.length-1)]||'10:00';const h=picked.main?hop(picked.main,String(s.prefecture||'')):99;const reason=h===0?'旅行先の県内':h===1?'近隣県で組み込みやすい':h===2?'少し広域の候補':'遠距離候補';t.plans.push({id:eid('plan'),spotId:s.id,title:s.name,date,time,cost:0,memo:[s.oneLine||'行きたい場所から自動作成',reason,interests.length?'重視：'+interests.join('・'):'',meal!=='自由に選ぶ'?'食事：'+meal:'',note?'希望：'+note:''].filter(Boolean).join(' ／ '),done:false,order:dayItems.length,transport,expenseCategory:'その他',v59Reason:reason});usedPrefByDay[date]=(usedPrefByDay[date]||[]).concat(s.prefecture||'');added++});save();
    showV59Result(t,added,{transport,pace,focus,interests,note,includeNearby,picked,usedPrefByDay});
  }
  function showV59Result(t,added,settings){
    const plans=(t.plans||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.time).localeCompare(String(b.time)));const byDay={};plans.forEach(p=>(byDay[p.date||'日付未定']??=[]).push(p));const focusLabel=settings.focus==='near'?'近さを優先':settings.focus==='priority'?'行きたい度を優先':'近さ＋行きたい度';
    const rows=Object.entries(byDay).map(([d,arr])=>`<div class="v59-result"><b>📅 ${esc(d)}</b>${arr.map(p=>{const s=data.spots.find(x=>x.id===p.spotId);return `<div class="v59-candidate"><div class="v59-icon">${s?.prefecture===prefFromDestination(t.destination)?'📍':'🗾'}</div><div><strong>${esc(p.time||'--:--')} ${esc(p.title)}</strong><div class="small">${esc(s?.prefecture||'')} ${p.v59Reason?`／${esc(p.v59Reason)}`:''}</div></div></div>`}).join('')}</div>`).join('');
    const nearby=settings.picked.nearbyCount;const main=settings.picked.main||'未設定';
    openModal(`<div class="modal-head"><h2>✨ 近さを考えた旅程</h2><button class="close" onclick="closeModal()">×</button></div><div class="card"><b>${esc(t.name)}</b><p class="small">中心：${esc(main)} ／ 重視：${esc(focusLabel)}</p><div class="v59-summary"><div class="v59-stat"><b>${settings.picked.usedCount}</b><span>候補</span></div><div class="v59-stat"><b>${nearby}</b><span>近隣県</span></div><div class="v59-stat"><b>${added}</b><span>今回追加</span></div></div><p class="v59-note">同じ県だけでなく、近隣県の「行きたい」も距離のまとまりを考えて候補にしました。遠い場所は、行きたい度が高くても今回の旅程に無理に詰め込まないようにしています。</p></div>${rows}<button class="btn full" onclick="closeModal();switchPage('plan')">🗓️ 旅程を確認・編集</button><button class="btn secondary full" style="margin-top:8px" onclick="closeModal();openPlanCompare()">🪄 3つの旅程を比較</button>`);
  }
  window.openConcierge=openConciergeV59;window.runConcierge=runConciergeV59;
})();
</script>

function v60AddPlan(pref,item){const t=typeof trip==='function'?trip():null;if(!t){openTripModal();toast('先に旅行を作成してください');return}let s=data.spots.find(x=>x.name===item.name);if(!s){s={id:eid('spot'),name:item.name,prefecture:pref,category:v60EnsureCategory(v60Genre),address:'',description:item.desc,oneLine:'おすすめから追加',memo:'',lat:'',lon:'',image:'',priority:4,favorite:true,visited:false};data.spots.unshift(s)}else s.favorite=true;t.plans=t.plans||[];if(t.plans.some(p=>p.spotId===s.id)){save();toast('すでにこの旅行の予定に入っています');return}const ds=typeof dates==='function'?dates(t):[];const date=ds[0]||t.startDate||today();t.plans.push({id:eid('plan'),spotId:s.id,title:s.name,date,time:'15:00',cost:0,memo:'おすすめから追加 ／ '+pref,done:false,order:t.plans.length,transport:t.transport||'未設定',expenseCategory:v60Genre});save();renderAll();v60Render();toast(item.name+'をこの旅行に追加しました')}
function v60Rotate(arr){if(!arr?.length)return[];const n=arr.length;const shift=v60Refresh%n;return arr.slice(shift).concat(arr.slice(0,shift))}

function v60SearchResults(q,pref,genre){let rows=[];Object.keys(V67_RECO).forEach(p=>{if(pref&&p!==pref)return;V60_GENRES.forEach(g=>{if(genre&&g!==genre)return;(V67_RECO[p]?.[g]||[]).forEach(x=>rows.push({...x,prefecture:p,genre:g}))})});q=String(q||'').trim().toLowerCase();if(q)rows=rows.filter(x=>`${x.name} ${x.desc} ${x.prefecture} ${x.genre}`.toLowerCase().includes(q));return rows.slice(0,24)}

 const updated=v60Updated?`更新：${new Date(v60Updated).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`:'';
 const genreButtons=V60_GENRES.map(g=>`<button class="v60-chip ${g===v60Genre?'on':''}" type="button" onclick="v60SetGenre('${g}')">${V60_ICONS[g]} ${g}</button>`).join('');

  <details class="v70-detail"><summary>詳しい条件を指定する</summary><label class="v60-label" for="v70PrefSelect">都道府県（任意）</label><select id="v70PrefSelect" class="field" onchange="v60SetPref(this.value)"><option value="">${v70SearchScope==='trip'?'旅行先から自動選択':'全国'}</option>${prefOptions}</select><p class="small">下のアプリ内おすすめ候補を絞り込みます。ウェブ検索は上の「ウェブで探す」を押してください。</p></details>

 <div class="v60-search-card"><label class="v60-label">アプリ内のおすすめ候補</label><div class="v60-search-row"><input id="v60Search" class="field" value="${v60Esc(q)}" placeholder="候補名・地域・キーワードで絞り込む"><button class="btn secondary" type="button" onclick="v60Render()">絞り込む</button></div><label class="v60-label">ジャンル</label><div class="v60-filter-row">${genreButtons}</div><div class="v60-update">${updated||'47都道府県の候補を収録'} ・ ${scopeLabel}の検索</div></div>`;

 html+=v60NearbyHTML(pref);body.innerHTML=html;

 if(v70SearchScope==='trip'&&!area){toast('旅行先が未設定です。全国から探すか、旅行先を設定してください');return;}

b.innerHTML=`<div class="trip"><div class="home-context"><div class="home-context-main"><strong>現在の旅行：${v60Esc(t.name||'名称未設定')}</strong><span>📍 ${v60Esc(t.destination||'行き先未定')} ・ 予定 ${done}/${plans.length}</span></div><button class="btn secondary" onclick="openTripModal('${t.id}')">編集</button></div><h2 style="margin-top:12px">${v60Esc(t.name||'旅行')}</h2><p>📅 ${v60Esc(t.startDate||'未定')} ～ ${v60Esc(t.endDate||'未定')}</p><div class="home-status-row"><div class="home-status"><strong>${pct}%</strong><span>旅程完了</span></div><div class="home-status"><strong>${data.spots.filter(x=>x.favorite).length}</strong><span>行きたい</span></div><div class="home-status"><strong>${plans.length}</strong><span>予定</span></div></div>${nextHtml}</div>`}else{b.innerHTML=`<div class="trip"><h2>次の旅行を作りましょう ✈️</h2><p>旅行先・日程・行きたい場所をまとめて管理できます。</p><div class="home-next"><div class="eyebrow">START</div><h3>まずは旅行を1つ作成</h3><p>基本情報を順番に入力すれば始められます。</p><div class="home-next-actions"><button class="btn" onclick="openQuickTripWizard()">✨ かんたん旅行作成</button><button class="btn secondary" onclick="v60OpenHelp('旅行データ')">使い方</button></div></div></div>`}
 const a=document.getElementById('statSpots'),b2=document.getElementById('statTrips'),c=document.getElementById('statNotes');if(a)a.textContent=data.spots.filter(x=>x.favorite).length;if(b2)b2.textContent=data.trips.length;if(c)c.textContent=data.notes.length;

:root{--v62-main:#159a8c;--v62-dark:#08786d;--v62-soft:#edf9f6;--v62-line:#dce9e6;--v62-text:#202b29;--v62-muted:#71807d}

#page-plan .v62-head h2{font-size:27px;line-height:1.15;margin:0;color:#1f2a28;letter-spacing:-.02em}
#page-plan .v62-sub{margin:5px 0 0;color:#6e7b79;font-size:13px;line-height:1.5}
.v62-head-actions{display:flex;gap:7px;flex:none}.v62-head-actions .btn{min-height:42px;padding:9px 12px}
.v62-trip-card{background:linear-gradient(135deg,#f1fbf9,#fffaf2);border:1px solid #d7ebe7;border-radius:20px;padding:15px;margin-bottom:12px}
.v62-trip-name{font-size:21px;font-weight:800;color:var(--v62-dark)}.v62-trip-meta{color:#6b7976;font-size:13px;margin-top:4px}.v62-trip-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}.v62-trip-actions .btn{min-height:44px}
.v62-section-label{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}.v62-section-label h3{font-size:19px;margin:0}.v62-section-label span{font-size:12px;color:#7a8785}
.v62-tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.v62-tool{border:1px solid var(--v62-line);background:#fff;border-radius:15px;padding:13px 11px;text-align:left;color:var(--v62-text);min-height:68px;font-weight:800}.v62-tool small{display:block;color:#778481;font-weight:500;font-size:11px;line-height:1.4;margin-top:3px}
.v62-day{margin:18px 0 0}.v62-day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.v62-day-title{font-size:20px;font-weight:800}.v62-day-count{font-size:12px;color:#74817f}.v62-day-route{background:#f6faf9;border:1px solid #e0ebe8;border-radius:14px;padding:10px 12px;margin-bottom:8px}.v62-day-route-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.v62-day-route b{color:var(--v62-dark);font-size:13px}.v62-day-route small{color:#74817f;line-height:1.45}
.v62-item{position:relative;display:grid;grid-template-columns:58px 1fr 32px;gap:8px;align-items:start;background:#fff;border:1px solid var(--v62-line);border-radius:17px;padding:12px;margin:8px 0;box-shadow:0 2px 10px rgba(25,70,65,.035)}
.v62-time{font-weight:800;color:var(--v62-dark);font-size:18px;line-height:1.15}.v62-time small{display:block;color:#7b8885;font-size:11px;font-weight:500;margin-top:4px}.v62-item-main strong{font-size:16px;line-height:1.3}.v62-item-main .v62-location{font-size:12px;color:#6f7c79;margin-top:4px}.v62-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.v62-badge{display:inline-flex;align-items:center;background:#f0f8f6;color:#39716b;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:700}.v62-badge.food{background:#fff6e8;color:#9a6a22}.v62-edit{width:32px;height:32px;border:0;border-radius:10px;background:#f2f7f6;font-size:15px}.v62-move{display:flex;gap:10px;align-items:center;padding:5px 13px 5px 21px;color:#6e7b78}.v62-move-line{width:2px;height:24px;background:#b9e4dd;margin-left:5px}.v62-move-main{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}.v62-move-main b{color:#4c6e69}.v62-move-main span{color:#758481}.v62-auto{font-size:10px;background:#eaf7f4;color:#258378;border-radius:999px;padding:3px 6px}.v62-public{font-size:10px;color:#7b8785}.v62-empty{padding:24px 14px;text-align:center;color:#778481;background:#fff;border:1px dashed #d6e4e1;border-radius:16px}
.v62-route-card{background:linear-gradient(135deg,#eefaf7,#fffaf2);border:1px solid #d5ebe6;border-radius:19px;padding:14px;margin:10px 0 14px}.v62-route-card h3{margin:0;color:var(--v62-dark);font-size:18px}.v62-route-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.v62-route-stat{background:#fff;border:1px solid #e2ecea;border-radius:13px;padding:10px}.v62-route-stat small{display:block;color:#7a8784;font-size:10px}.v62-route-stat b{display:block;margin-top:3px;font-size:15px;color:#2d4d49}.v62-route-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.v62-note{font-size:11px;color:#6d7a77;line-height:1.55;margin-top:9px}.v62-progress{height:9px;background:#e7eeee;border-radius:99px;overflow:hidden;margin-top:8px}.v62-progress i{display:block;height:100%;background:var(--v62-main);border-radius:99px}
.v62-plan-alert{padding:11px 12px;border-radius:13px;background:#fff8e8;color:#856321;font-size:12px;line-height:1.5;margin:9px 0}.v62-plan-ok{padding:11px 12px;border-radius:13px;background:#eefaf7;color:#39716b;font-size:12px;line-height:1.5;margin:9px 0}
.v62-map-link{display:block;text-align:center;text-decoration:none;margin-top:8px}
@media(max-width:560px){.v62-trip-actions{grid-template-columns:1fr 1fr}.v62-trip-actions .btn:last-child{grid-column:1/-1}.v62-route-summary,.v62-route-actions{grid-template-columns:1fr}.v62-item{grid-template-columns:54px 1fr 30px}.v62-time{font-size:17px}}
</style>
<script id="v62-script">
(function(){
  const KEY='travel_note_departure_plan_v56_';
  const routeCache=new Map();
  const esc62=v=>typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const trip62=()=>typeof trip==='function'?trip():null;
  const sorted62=t=>[...(t?.plans||[])].slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||''))||(a.order??0)-(b.order??0));
  const spot62=p=>p?.spotId?data.spots.find(s=>s.id===p.spotId):null;
  const catName62=p=>{const s=spot62(p);return s&&typeof cat==='function'?cat(s.category)?.name||'':p?.expenseCategory==='食費'?'グルメ':''};
  const mealDefault62=(kind,p)=>kind==='グルメ'||kind==='カフェ'||p?.expenseCategory==='食費'?'昼食':'なし';
  const transportIcon62=m=>({車:'🚗',電車:'🚆',バス:'🚌','電車・バス':'🚆',新幹線:'🚄',徒歩:'🚶',自転車:'🚲',タクシー:'🚕',飛行機:'✈️',船:'⛴️'}[m]||'🧭');
  const transportLabel62=m=>({car:'🚗 車',trainbus:'🚆 電車・バス',shinkansen:'🚄 新幹線'}[m]||'🚗 車');
  const loadCfg62=t=>{try{return JSON.parse(localStorage.getItem(KEY+t.id)||'{}')}catch(e){return{}}};
  const saveCfg62=(t,c)=>localStorage.setItem(KEY+t.id,JSON.stringify(c));
  const toMin62=hm=>{const m=String(hm||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null};
  const fromMin62=n=>{n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
  const fmtDur62=n=>{n=Number(n);if(!Number.isFinite(n)||n<=0)return '未計算';const h=Math.floor(n/60),m=Math.round(n%60);return h?`${h}時間${m?m+'分':''}`:`${m}分`};
  function mapsDir62(origin,dest,mode){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin||'')+'&destination='+encodeURIComponent(dest||'')+'&travelmode='+encodeURIComponent(mode||'driving')}
  function mapsDay62(items,mode){const places=items.map(p=>{const s=spot62(p);return s?.address||s?.name||p.location||p.title}).filter(Boolean);if(places.length<2)return null;let u=mapsDir62(places[0],places[places.length-1],mode||'driving');const mid=places.slice(1,-1);if(mid.length)u+='&waypoints='+encodeURIComponent(mid.join('|'));return u}
  function openExternal62(url){if(!url)return false;const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);return true}
  window.v62OpenMaps=function(date){const t=trip62();if(!t)return;const items=sorted62(t).filter(p=>(p.date||'日付未定')===date);const cfg=loadCfg62(t);let mode='driving';if(cfg.transportMode==='trainbus'||cfg.transportMode==='shinkansen')mode='transit';const u=mapsDay62(items,mode);if(!u){toast('この日の予定が2か所以上必要です');return}openExternal62(u);toast('Google Mapsを開きました')};
  window.launchGoogleRoute=function(date){window.v62OpenMaps(date)};
  window.openRoute=function(date){window.v62OpenMaps(date)};

  window.applyTransportMode=function(m){const t=trip62();if(!t)return;const c=loadCfg62(t);c.transportMode=m;saveCfg62(t,c);document.querySelectorAll('[data-v57-mode]').forEach(b=>b.classList.toggle('active',b.dataset.v57Mode===m));const car=document.getElementById('v57CarTools'),trans=document.getElementById('v57TransitTools');if(car)car.style.display=m==='car'?'block':'none';if(trans)trans.style.display=m==='car'?'none':'block';const note=document.getElementById('v57ModeNote');if(note)note.textContent=m==='car'?'道路ルートから車の推定所要時間・距離を自動取得します。':m==='trainbus'?'電車・バスはGoogle Mapsで乗換・時刻・運賃を確認します。':'新幹線を含む公共交通ルートをGoogle Mapsで確認します。';if(typeof toast==='function')toast(transportLabel62(m)+'に変更しました')};

  async function geocode62(q){const key=String(q||'').trim();if(!key)throw new Error('場所情報がありません');if(routeCache.has(key))return routeCache.get(key);const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&q='+encodeURIComponent(key);const r=await fetch(u,{headers:{Accept:'application/json','Accept-Language':'ja'}});if(!r.ok)throw new Error('場所の検索に失敗しました');const a=await r.json();if(!a.length)throw new Error('場所が見つかりませんでした');const g={lat:Number(a[0].lat),lon:Number(a[0].lon)};routeCache.set(key,g);return g}
  async function coords62(p){const s=spot62(p);if(s&&Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lon)))return{lat:Number(s.lat),lon:Number(s.lon)};const q=s?.address||p?.location||s?.name||p?.title;return geocode62(q)}
  async function osrm62(a,b){const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;const r=await fetch(u);if(!r.ok)throw new Error('車のルート検索に失敗しました');const j=await r.json();if(j.code!=='Ok'||!j.routes?.[0])throw new Error('車のルートが見つかりませんでした');return{minutes:Math.max(1,Math.round(j.routes[0].duration/60)),km:(j.routes[0].distance/1000).toFixed(1)}}
  async function autoDay62(date,quiet){const t=trip62();if(!t)return false;const items=sorted62(t).filter(p=>(p.date||'日付未定')===date);if(items.length<2)return false;let changed=false;for(let i=1;i<items.length;i++){const p=items[i],prev=items[i-1];const mode=p.transport||t.transport||'車';if(Number(p.transportTime)>0&&p.transportTimeSource!=='auto')continue;if(!['車','未設定'].includes(mode))continue;try{const sig=prev.id+'>'+p.id;const rr=await osrm62(await coords62(prev),await coords62(p));p.transportTime=rr.minutes;p.transportDistance=rr.km;p.transportTimeSource='auto';p.transportRouteKey=sig;changed=true}catch(e){p.transportTimeError='自動取得できませんでした';}}
    if(changed){save();if(!quiet){toast(date+'の車移動時間を自動反映しました');renderPlan()}}return changed}
  window.v62AutoDayRoutes=function(date){autoDay62(date,false)};
  let autoRunning62=false;
  function needsAuto62(t){const a=sorted62(t);for(let i=1;i<a.length;i++){if((a[i].date||'日付未定')!==(a[i-1].date||'日付未定'))continue;const m=a[i].transport||t.transport||'車';if((m==='車'||m==='未設定')&&!Number(a[i].transportTime))return true}return false}
  window.v62AutoAllRoutes=async function(){const t=trip62();if(!t||autoRunning62)return;autoRunning62=true;try{const ds=[...new Set(sorted62(t).map(p=>p.date||'日付未定'))];let changed=false;for(const d of ds)changed=(await autoDay62(d,true))||changed;if(changed)renderPlan();else toast('自動計算できる車の移動時間はありませんでした。必要な区間はGoogle Mapsで確認できます。')}finally{autoRunning62=false}};

  function routeSummary62(){const el=document.getElementById('departureRouteSummary');const t=trip62();if(!el)return;if(!t){el.innerHTML='';return}const cfg=loadCfg62(t),ps=sorted62(t);if(!ps.length){el.innerHTML=`<div class="v62-route-card"><h3>🧭 出発・帰宅計画</h3><p class="v62-note">現在地または出発地点を設定し、車・電車・バス・新幹線から移動手段を選べます。</p><button class="btn full" onclick="openDeparturePlanV56()">出発・帰宅を計画</button></div>`;return}const first=ps.find(p=>p.id===cfg.firstPlanId)||ps[0],last=ps.find(p=>p.id===cfg.lastPlanId)||ps[ps.length-1];const arr=toMin62(cfg.arrivalTime),leave=toMin62(cfg.returnLeaveTime),od=Number(cfg.outboundDuration)||0,rd=Number(cfg.returnDuration)||0,buf=Number(cfg.buffer)||0;const out=arr!==null&&od?fromMin62(arr-od-buf):'未計算',ret=leave!==null&&rd?fromMin62(leave+rd):'未計算';const mode=cfg.transportMode||'car';el.innerHTML=`<div class="v62-route-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><h3>🧭 出発・帰宅計画</h3><p class="v62-note">${cfg.origin?'出発地点：'+esc62(cfg.origin):'出発地点が未設定です。'}</p></div><button class="btn secondary" onclick="openDeparturePlanV56()">詳細</button></div><div class="v62-route-summary"><div class="v62-route-stat"><small>移動手段</small><b>${transportLabel62(mode)}</b></div><div class="v62-route-stat"><small>最初の目的地</small><b>${esc62(spot62(first)?.name||first.title)}</b></div><div class="v62-route-stat"><small>行き</small><b>${cfg.outboundKm?esc62(cfg.outboundKm)+'km / ':''}${fmtDur62(od)}</b></div><div class="v62-route-stat"><small>帰り</small><b>${cfg.returnKm?esc62(cfg.returnKm)+'km / ':''}${fmtDur62(rd)}</b></div></div><div class="v62-note">おすすめ出発 ${out} ／ 帰宅予定 ${ret}</div><div class="v62-route-actions"><button class="btn" onclick="openDeparturePlanV56()">🧭 出発・帰宅を編集</button><button class="btn secondary" onclick="v57UseCurrentLocation().then(()=>v57AutoRoute('all')).then(()=>renderPlan()).catch(()=>{})">📍 現在地を更新</button></div><div class="v62-note">公共交通はGoogle Mapsで最新の乗換・時刻を確認します。</div></div>`}
  window.renderDepartureRouteSummary=routeSummary62;

  function renderPlan62(){const t=trip62();const hero=document.getElementById('planHero'),box=document.getElementById('tripSelector'),budget=document.getElementById('budget'),expense=document.getElementById('expensePanel'),summary=document.getElementById('planSummary'),tools=document.getElementById('planTools'),list=document.getElementById('planList'),weather=document.getElementById('weatherBox');if(!t){hero.innerHTML='';box.innerHTML='';budget.innerHTML='';expense.innerHTML='';summary.innerHTML='';tools.innerHTML='';list.innerHTML='<div class="v62-empty">まず旅行を作成してください。</div>';routeSummary62();return}
    const a=sorted62(t),spent=a.reduce((n,p)=>n+(+p.cost||0),0),bud=+t.budget||0,done=a.filter(p=>p.done).length,pct=a.length?Math.round(done/a.length*100):0;
    hero.innerHTML=`<div class="v62-head"><div><h2>旅行プラン</h2><p class="v62-sub">時間・場所・移動までつながった、旅行の全体計画です。</p></div><div class="v62-head-actions"><button class="btn secondary" onclick="openTravelMode()">📱 旅行中</button></div></div>`;
    box.innerHTML=`<div class="v62-trip-card"><div class="v62-trip-name">${esc62(t.name||'旅行')}</div><div class="v62-trip-meta">${esc62(t.destination||'行き先未設定')} ${t.startDate&&t.endDate?`・ ${esc62(t.startDate)} ～ ${esc62(t.endDate)}`:''}</div><div class="v62-trip-actions"><button class="btn secondary" onclick="openTripModal('${t.id}')">✏️ 旅行情報</button><button class="btn secondary" onclick="openExpenseModal()">💰 支出</button><button class="btn" onclick="openPlanModal()">＋ 予定を追加</button></div></div>`;
    routeSummary62();
    budget.innerHTML=`<div class="card"><b>旅行予算 ${bud.toLocaleString()}円</b><p class="small">予定に入れた費用 ${spent.toLocaleString()}円 ／ 残り ${Math.max(0,bud-spent).toLocaleString()}円</p>${bud&&spent>bud?'<div class="v62-plan-alert">⚠️ 予定費用が予算を超えています。</div>':''}</div>`;
    if(typeof renderExpensePanel==='function')renderExpensePanel(t);else expense.innerHTML='';
    summary.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>旅程の進み具合</b><div class="small">${done} / ${a.length} 件完了</div></div><strong style="color:#08786d;font-size:20px">${pct}%</strong></div><div class="v62-progress"><i style="width:${pct}%"></i></div></div>`;
    tools.innerHTML=`<div class="v62-section-label"><h3>旅程を整える</h3><span>計画に必要な機能をここへ集約</span></div><div class="v62-tools"><button class="v62-tool" onclick="openConcierge()">✨ 旅行コンシェルジュ<small>行きたい場所と近さから旅程を組む</small></button><button class="v62-tool" onclick="openPlanCompare()">🪄 3つの旅程を比較<small>違う組み方を見比べる</small></button><button class="v62-tool" onclick="optimizeAllDays()">🧭 順番を整える<small>移動のまとまりを考えて並べる</small></button><button class="v62-tool" onclick="openRainPlan()">☔ 雨の日プラン<small>雨の日でも回りやすく組み直す</small></button><button class="v62-tool" onclick="openTripDashboard()">📋 旅行全体<small>日程・予算・旅行全体を確認</small></button><button class="v62-tool" onclick="openTripHealth()">🩺 旅行プランを診断<small>無理な予定や不足を確認</small></button><button class="v62-tool" onclick="v62AutoAllRoutes()">🛣️ 移動時間を自動計算<small>車で移動する区間の時間を旅程へ反映</small></button><button class="v62-tool" onclick="openInfoCenter()">🌐 旅行情報センター<small>天気・ホテル・交通などを確認</small></button><button class="v62-tool" onclick="openPacking()">🎒 持ち物リスト<small>出発前の準備を確認</small></button><button class="v62-tool" onclick="openItinerarySheet()">📖 旅のしおり<small>旅行全体をまとめて確認</small></button></div>`;
    weather.innerHTML=a.length?`<div class="card"><b>☀️ 旅行初日の天気</b><p class="small">場所情報があるスポットから予報を確認できます。</p><button class="btn secondary" onclick="loadWeather()">天気を見る</button></div>`:'';
    if(!a.length){list.innerHTML='<div class="v62-empty">まだ予定がありません。<br><button class="btn" style="margin-top:10px" onclick="openPlanModal()">＋ 最初の予定を追加</button></div>';return}
    const groups={};a.forEach(p=>(groups[p.date||'日付未定']??=[]).push(p));let html='';for(const [date,items] of Object.entries(groups)){html+=`<div class="v62-day"><div class="v62-day-head"><div class="v62-day-title">📅 ${esc62(date)}</div><div class="v62-day-count">${items.filter(p=>p.done).length}/${items.length} 完了</div></div><div class="v62-day-route"><div class="v62-day-route-top"><b>🗺️ この日の移動</b><button class="btn secondary" onclick='v62OpenMaps(${JSON.stringify(date)})'>Google Maps</button></div><small>予定の順番を地図で確認できます。車の移動時間は自動計算できます。</small></div>`;
      items.forEach((p,i)=>{if(i>0){const prev=items[i-1],mt=Number(p.transportTime)||0;const icon=transportIcon62(p.transport||'車');html+=`<div class="v62-move"><div class="v62-move-line"></div><div class="v62-move-main"><b>${icon} 移動</b><span>${mt?`約${fmtDur62(mt)}${p.transportDistance?'・'+esc62(p.transportDistance)+'km':''}`:'移動時間 未計算'}</span>${p.transportTimeSource==='auto'?'<span class="v62-auto">自動</span>':''}${p.transportTimeError?'<span class="v62-public">自動取得できませんでした</span>':''}${['電車','バス','電車・バス','新幹線'].includes(p.transport)?'<span class="v62-public">Google Mapsで乗換確認</span>':''}</div></div>`}

  // ホームの重複「スポットを探す」「旅行プラン」は既存V63で整理済みのため、重複入口だけを1つに統合表示
  setTimeout(()=>{try{v64NormalizePlans();renderAll();}catch(e){}},0);
})();

  // 風景印のリンクは都道府県IDを推測せず、公式トップを開く。公式サイト側で都道府県・キーワード検索できます。

<script id="v65-script">
/* V65: 店舗検索の汎用化・食事編集修正・終点設定・ルート2-opt・ドラッグ並べ替え */
(function(){
  const mealTimes65={朝食:'07:00',昼食:'12:00',夕食:'18:00'};
  const esc65=v=>typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const foodRe65=/グルメ|カフェ|レストラン|食堂|喫茶|お好み焼|ラーメン|寿司|そば|うどん|焼肉|食事|スイーツ|パフェ|パン/i;
  function food65(s){return !!s&&foodRe65.test([s.name,s.description,s.oneLine,s.category].join(' '))}
  function fmt65(a){return typeof formatAddress==='function'?formatAddress(a):String(a||'')}
  function spot65(p){return (data.spots||[]).find(s=>s.id===p?.spotId)||null}
  function save65(){save();}
  async function geocode65(q){
    const k=String(q||'').trim(); if(!k)throw new Error('場所がありません');
    const cache=window.__v65Geo||(window.__v65Geo={}); if(cache[k])return cache[k];
    const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&q='+encodeURIComponent(k);
    const r=await fetch(u,{headers:{Accept:'application/json'}}); if(!r.ok)throw new Error('住所検索に失敗しました');
    const a=await r.json(); if(!a.length)throw new Error('場所が見つかりませんでした');
    const v={lat:Number(a[0].lat),lon:Number(a[0].lon),label:a[0].display_name||k}; cache[k]=v; return v;
  }
  async function enrich65(s){
    if(!s)return s; s.address=fmt65(s.address||s.location||''); s.location=s.address||s.location||'';
    if(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lon)))return s;
    try{const g=await geocode65([s.name,s.address,s.prefecture].filter(Boolean).join(' '));s.lat=g.lat;s.lon=g.lon;if(!s.address)s.address=fmt65(g.label);s.location=s.address||g.label||'';save65();}catch(e){}
    return s;
  }
  function ensureCat65(name,icon){data.categories=data.categories||[];let c=data.categories.find(x=>x.name===name);if(c)return c.id;const id=eid('cat');data.categories.push({id,name,icon:icon||'📍'});return id;}

  // 店舗検索を「登録済み候補だけ」から「必要なら実在店舗を検索」に拡張する。
  window.v65SearchBusinesses=async function(area,genre){
    const q=(document.getElementById('v65BusinessQuery')?.value||'').trim()||(`${area} ${genre==='カフェ'?'カフェ':'グルメ'}`);
    const style=document.getElementById('v65BusinessStyle')?.value||'';
    const out=document.getElementById('v65SearchResults');if(!out)return;out.innerHTML='<div class="small">🔎 実在する店舗を検索しています…</div>';
    try{
      const query=[q,style].filter(Boolean).join(' ');
      const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=jp&addressdetails=1&q='+encodeURIComponent(query);
      const r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('search');const rows=await r.json();
      window.__v65SearchResults=rows.map(x=>({name:x.name||x.display_name?.split(',')[0]||q,address:fmt65(x.display_name||''),lat:Number(x.lat),lon:Number(x.lon),prefecture:x.address?.state||'',city:x.address?.city||x.address?.town||x.address?.municipality||'',desc:'検索で見つかった店舗・施設候補',style:style?[style]:[genre]}));
      if(!rows.length){out.innerHTML='<div class="v65-note">候補が見つかりませんでした。店名を具体的に入れてもう一度検索してください。</div>';return;}
      out.innerHTML=window.__v65SearchResults.map((c,i)=>`<div class="v65-result"><h4>${esc65(c.name)}</h4><div class="addr">📍 ${esc65(c.address||'住所未取得')}</div><div class="v65-action-grid"><button class="btn" onclick="v65UseSearchResult(${i},false)">＋ 行きたい</button><button class="btn secondary" onclick="v65UseSearchResult(${i},true)">🗓 この旅行に追加</button><a class="btn secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.name+' '+(c.address||area))}">🗺️ 地図</a></div></div>`).join('');
    }catch(e){out.innerHTML='<div class="v65-note">店舗検索に失敗しました。少し時間を置いて再度お試しください。</div>'}
  };
  window.v65UseSearchResult=async function(i,addPlan){const c=window.__v65SearchResults?.[i];if(!c)return;const genre=(document.getElementById('v65Genre')?.value||'グルメ');let s=(data.spots||[]).find(x=>x.name===c.name&&fmt65(x.address)===fmt65(c.address));if(!s){s={id:eid('spot'),name:c.name,prefecture:c.prefecture||'',category:ensureCat65(genre==='カフェ'?'カフェ':'グルメ',genre==='カフェ'?'☕':'🍴'),address:fmt65(c.address),location:fmt65(c.address),description:c.desc,oneLine:c.desc,memo:'店舗検索から追加',lat:c.lat||'',lon:c.lon||'',image:'',priority:4,favorite:true,visited:false,mealType:'昼食'};data.spots.unshift(s)}else{s.favorite=true;s.lat=s.lat||c.lat;s.lon=s.lon||c.lon;s.address=fmt65(s.address||c.address);s.location=s.address||s.location||''}
    if(addPlan){const t=trip();if(!t){closeModal();openTripModal();return}if(window.v64InsertMealPlan)window.v64InsertMealPlan(t,s,'昼食');else{t.plans=t.plans||[];t.plans.push({id:eid('plan'),spotId:s.id,title:s.name,date:t.startDate||today(),time:'12:00',mealType:'昼食',duration:60,location:s.address,cost:0,expenseCategory:'食費',order:t.plans.length})}save();closeModal();renderAll();switchPage('plan');toast(`${s.name}を昼食（12:00）として追加しました`)}else{save();closeModal();renderAll();switchPage('explore');toast(`${s.name}を「行きたい」に追加しました`)}}

  // 既存の店舗選択モーダルに汎用検索欄を追加。登録済み候補はそのまま残す。
  const oldPicker65=window.openBusinessPicker;
  window.openBusinessPicker=function(area,genre,initialStyle='すべて'){
    oldPicker65(area,genre,initialStyle);
    setTimeout(()=>{
      const modal=document.getElementById('modal');if(!modal||modal.dataset.v65Picker==='1')return;modal.dataset.v65Picker='1';
      const head=modal.querySelector('.modal-head');
      const box=document.createElement('div');box.className='v65-search-box';box.innerHTML=`<b>🔎 実際のお店を検索</b><p class="small">候補にない店舗も、店名・料理名・特徴から検索できます。</p><div class="v65-search-row"><input id="v65BusinessQuery" class="field" value="${esc65(area+' '+(genre==='カフェ'?'カフェ':'グルメ'))}" placeholder="例：広島 お好み焼き"></div><div class="v65-search-row" style="margin-top:7px"><select id="v65BusinessStyle" class="field"><option value="">特徴を追加しない</option><option>レトロ</option><option>古民家</option><option>隠れ家</option><option>海が見える</option><option>おしゃれ</option><option>老舗</option><option>有名店</option><option>名物料理</option></select><input type="hidden" id="v65Genre" value="${esc65(genre)}"></div><button class="btn full" style="margin-top:8px" onclick="v65SearchBusinesses(${JSON.stringify(area)},${JSON.stringify(genre)})">店舗を検索する</button><div id="v65SearchResults"></div>`;
      head?.insertAdjacentElement('afterend',box);
    },0);
  };

  // 「この旅行に追加」時点で住所・座標を確定させる。編集画面の住所取得は不要にする。
  const oldAddPlan65=window.v60AddPlan;
  window.v60AddPlan=async function(name){
    if(typeof oldAddPlan65==='function')return oldAddPlan65(name);
    toast('店舗を選択してから旅行に追加してください');
  };

  // 食事編集の不具合を修正。セレクト値を「元の保存処理より先」に反映する。
  const baseSavePlan65=window.savePlan;
  window.savePlan=function(id){
    const sel=document.getElementById('v64MealSelect');
    const s=sel?.value||'';
    const p=id?(trip()?.plans||[]).find(x=>x.id===id):null;
    const sp=p?spot65(p):null;
    if(s&&sp&&food65(sp)){
      const nativeMeal=document.getElementById('pmeal');if(nativeMeal)nativeMeal.value=s;
      const time=document.getElementById('ptime');if(time)time.value=mealTimes65[s];
    }
    const r=baseSavePlan65(id);
    if(s){const t=trip(),pp=id?(t?.plans||[]).find(x=>x.id===id):null;const ss=pp?spot65(pp):null;if(pp&&food65(ss)){pp.mealType=s;pp.time=mealTimes65[s];pp.expenseCategory='食費';pp.location=fmt65(ss.address||pp.location||'');save();setTimeout(()=>renderPlan(),0)}}
    return r;
  };

  // 終了地点を追加。未設定なら「出発地点に戻る」ことも選べる。
  window.v65SetEndMode=function(mode){const t=trip();if(!t)return;t.v64Departure=t.v64Departure||{};t.v64Departure.endMode=mode;save();document.querySelectorAll('[name="v65endmode"]').forEach(x=>x.checked=x.value===mode);};
  window.v65PreviewEnd=async function(){const q=(document.getElementById('v65End')?.value||'').trim();if(!q){toast('終了地点を入力してください');return}try{const g=await geocode65(q);const t=trip();t.v64Departure=t.v64Departure||{};t.v64Departure.endText=q;t.v64Departure.endLat=g.lat;t.v64Departure.endLon=g.lon;t.v64Departure.endMode='fixed';save();document.getElementById('v65EndResult').textContent='📍 '+fmt65(g.label)+'（終了地点として保存しました）';}catch(e){document.getElementById('v65EndResult').textContent='⚠️ 場所が見つかりませんでした'}};

  // 緯度経度の距離。2-optで最近傍法の「行ったり来たり」をさらに減らす。
  function d65(a,b){if(!a||!b)return Infinity;const dx=(Number(a.lat)-Number(b.lat))*111,dy=(Number(a.lon)-Number(b.lon))*85;return Math.hypot(dx,dy)}
  function twoOpt65(list,origin,end){
    let best=list.slice(),changed=true,guard=0;
    const pts=[origin,...best,...(end?[end]:[])];
    const cost=arr=>{let c=0;for(let i=0;i<arr.length-1;i++)c+=d65(arr[i],arr[i+1]);return c};
    let bestCost=cost(pts);
    while(changed&&guard++<80){changed=false;for(let i=0;i<best.length-1;i++){for(let j=i+1;j<best.length;j++){const cand=best.slice();const rev=cand.slice(i,j+1).reverse();cand.splice(i,j-i+1,...rev);const c=cost([origin,...cand,...(end?[end]:[])]);if(c+0.001<bestCost){best=cand;bestCost=c;changed=true;}}}}
    return best;
  }
  async function build65(){
    const t=trip();if(!t){openTripModal();return}const fav=data.spots.filter(s=>s.favorite);if(!fav.length){toast('まず「行きたい場所」を登録してください');return}
    const depText=(document.getElementById('v64Origin')?.value||'').trim();if(!depText){toast('出発地点を設定してください');return}
    t.v64Departure=t.v64Departure||{};t.v64Departure.text=depText;let origin={lat:Number(t.v64Departure.lat),lon:Number(t.v64Departure.lon)};
    if(!Number.isFinite(origin.lat)||!Number.isFinite(origin.lon)){const g=await geocode65(depText);origin={lat:g.lat,lon:g.lon};t.v64Departure.lat=g.lat;t.v64Departure.lon=g.lon}
    let end=null;const endMode=document.querySelector('[name="v65endmode"]:checked')?.value||t.v64Departure.endMode||'return';if(endMode==='fixed'){const q=(document.getElementById('v65End')?.value||t.v64Departure.endText||'').trim();if(q){const g=await geocode65(q);end={lat:g.lat,lon:g.lon};t.v64Departure.endText=q;t.v64Departure.endLat=g.lat;t.v64Departure.endLon=g.lon}}else if(endMode==='return'){end=origin}
    const spots=[];for(const s of fav.slice(0,24)){await enrich65(s);if(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lon)))spots.push(s)}
    if(!spots.length){toast('位置情報を取得できるスポットがありませんでした');return}
    // 最近傍で初期順を作り、2-optで交差・遠回りを減らす。
    let rem=spots.slice(),ordered=[],cur=origin;while(rem.length){let bi=0,bd=Infinity;rem.forEach((s,i)=>{const z=d65(cur,s);if(z<bd){bd=z;bi=i}});const s=rem.splice(bi,1)[0];ordered.push(s);cur=s}ordered=twoOpt65(ordered,origin,end);
    const ds=typeof dates==='function'?dates(t):[];const days=ds.length||1;const buckets=Array.from({length:days},()=>[]);
    // まず地理順で日程を均等化。ただし食事は各日07/12/18を優先。
    ordered.forEach((s,i)=>buckets[Math.min(Math.floor(i/Math.max(1,Math.ceil(ordered.length/days))),days-1)].push(s));
    t.plans=t.plans||[];const ids=new Set(ordered.map(s=>s.id));t.plans=t.plans.filter(p=>!ids.has(p.spotId));
    buckets.forEach((bucket,di)=>{const date=ds[di]||t.startDate||today();let mealIndex=0,normalIndex=0;bucket.forEach(s=>{let time='09:00',meal='';if(food65(s)){meal=['朝食','昼食','夕食'][Math.min(mealIndex,2)];time=mealTimes65[meal];mealIndex++;}else{const times=['09:00','10:30','14:00','15:30','16:30','17:00'];time=times[Math.min(normalIndex,times.length-1)];normalIndex++;}t.plans.push({id:eid('plan'),spotId:s.id,title:s.name,date,time,mealType:meal||undefined,duration:food65(s)?60:90,transport:'未設定',transportTime:0,location:fmt65(s.address||s.location||''),cost:0,memo:food65(s)?'🍴 '+meal+' ／ 店舗確定':'🧭 地理順＋2-optで移動を効率化',done:false,order:t.plans.filter(p=>p.date===date).length,expenseCategory:food65(s)?'食費':'その他',reservation:'なし'});});});
    t.v64Departure.endMode=endMode;save();closeModal();renderAll();switchPage('plan');toast('出発地・終了地と地理順を考慮して旅程を作成しました');
  }
  window.v64BuildOptimizedPlan=build65;window.generatePlan=build65;

  // 既存の出発地モーダルを拡張して終了地点を選べるようにする。
  const oldBuilder65=window.openV64PlanBuilder;
  window.openV64PlanBuilder=function(){
    oldBuilder65();setTimeout(()=>{const modal=document.getElementById('modal');if(!modal||modal.dataset.v65Route==='1')return;modal.dataset.v65Route='1';const t=trip(),dep=t?.v64Departure||{};const end=document.createElement('div');end.className='v65-route-end';end.innerHTML=`<b>③ 終了地点</b><p class="small">旅行の最後を別の場所にするか、出発地へ戻るかを選べます。</p><label style="display:block;margin:6px 0"><input type="radio" name="v65endmode" value="return" ${(dep.endMode||'return')==='return'?'checked':''}> 出発地に戻る</label><label style="display:block;margin:6px 0"><input type="radio" name="v65endmode" value="fixed" ${dep.endMode==='fixed'?'checked':''}> 別の終了地点を指定</label><input id="v65End" class="field" value="${esc65(dep.endText||'')}" placeholder="例：広島駅、ホテル名など"><button class="btn secondary full" style="margin-top:7px" onclick="v65PreviewEnd()">終了地点を確認</button><div id="v65EndResult" class="small" style="margin-top:6px"></div>`;modal.appendChild(end);const old=modal.querySelector('button[onclick*="v64BuildOptimizedPlan"]');if(old){old.textContent='✨ 出発地・終了地を基準に旅程を作る';old.onclick=build65;old.removeAttribute('onclick')}} ,0)
  };

  // PCではドラッグ＆ドロップ、スマホでは従来の長押しメニューを維持。
  function bindDnD65(){document.querySelectorAll('.v64-plan-touch').forEach(el=>{if(el.dataset.v65Dnd)return;el.dataset.v65Dnd='1';el.draggable=true;el.addEventListener('dragstart',e=>{el.classList.add('v65-dragging');e.dataTransfer.setData('text/plain',el.dataset.planId);e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',()=>{el.classList.remove('v65-dragging');document.querySelectorAll('.v65-drop-target').forEach(x=>x.classList.remove('v65-drop-target'))});el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('v65-drop-target')});el.addEventListener('dragleave',()=>el.classList.remove('v65-drop-target'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('v65-drop-target');const from=e.dataTransfer.getData('text/plain');const to=el.dataset.planId;if(from&&to&&from!==to)v65DropReorder(from,to)})})}
  window.v65DropReorder=function(fromId,toId){const t=trip();if(!t)return;const a=t.plans.find(x=>x.id===fromId),b=t.plans.find(x=>x.id===toId);if(!a||!b||a.date!==b.date)return;const arr=t.plans.filter(x=>x.date===a.date).sort((x,y)=>(x.order??0)-(y.order??0));const from=arr.findIndex(x=>x.id===fromId),to=arr.findIndex(x=>x.id===toId);if(from<0||to<0)return;const [m]=arr.splice(from,1);arr.splice(to,0,m);arr.forEach((p,i)=>p.order=i);save();renderPlan();toast('予定の順番を変更しました')};
  const oldRP65=window.renderPlan;window.renderPlan=function(){oldRP65();setTimeout(bindDnD65,30)};
  setTimeout(()=>{try{bindDnD65()}catch(e){}},500);
})();
</script>

<script id="v66-script">
/* V66: 店舗情報強化・営業時間チェック・道路ルート評価・地域まとまり・食事枠管理・旅ノートコレクション */
(function(){
  const mealTimes66={朝食:'07:00',昼食:'12:00',夕食:'18:00'};
  const mealSlots66=['朝食','昼食','夕食'];
  const esc66=v=>typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const food66=s=>!!s&&/グルメ|カフェ|レストラン|食堂|喫茶|お好み焼|ラーメン|寿司|そば|うどん|焼肉|食事|スイーツ|パフェ|パン/i.test([s.name,s.description,s.oneLine,s.category].join(' '));
  const fmt66=a=>typeof formatAddress==='function'?formatAddress(a):String(a||'');
  const spot66=p=>(data.spots||[]).find(s=>s.id===p?.spotId)||null;
  const dist66=(a,b)=>{if(!a||!b)return Infinity;const dx=(Number(a.lat)-Number(b.lat))*111;const dy=(Number(a.lon)-Number(b.lon))*85;return Math.hypot(dx,dy)};
  const escQ66=q=>encodeURIComponent(String(q||''));
  async function geo66(q){const k=String(q||'').trim();if(!k)throw new Error('場所がありません');const c=window.__v66Geo||(window.__v66Geo={});if(c[k])return c[k];const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&addressdetails=1&extratags=1&q='+escQ66(k);const r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('geocode');const a=await r.json();if(!a.length)throw Error('notfound');const x=a[0],v={lat:Number(x.lat),lon:Number(x.lon),label:x.display_name||k,address:fmt66(x.display_name||''),extratags:x.extratags||{},type:x.type||'',category:x.category||''};c[k]=v;return v}
  async function enrich66(s){if(!s)return s;s.address=fmt66(s.address||s.location||'');s.location=s.address||s.location||'';if(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lon)))return s;try{const g=await geo66([s.name,s.address,s.prefecture].filter(Boolean).join(' '));s.lat=g.lat;s.lon=g.lon;if(!s.address)s.address=g.address;s.location=s.address||g.label||'';s.opening_hours=s.opening_hours||g.extratags?.opening_hours||'';s.website=s.website||g.extratags?.website||'';s.phone=s.phone||g.extratags?.phone||'';save()}catch(e){}return s}
  function catName66(s){return String(s?.category||'')}
  function mealTimeFor66(p){return mealTimes66[p?.mealType]||'12:00'}
  function isFoodPlan66(p){return food66(spot66(p))||p?.expenseCategory==='食費'||/🍴/.test(String(p?.memo||''))}
  function normalizeMeals66(){(data.trips||[]).forEach(t=>(t.plans||[]).forEach(p=>{if(isFoodPlan66(p)){p.mealType=p.mealType&&mealTimes66[p.mealType]?p.mealType:'昼食';p.time=mealTimes66[p.mealType];p.expenseCategory='食費';const s=spot66(p);if(s){s.address=fmt66(s.address||s.location||'');s.location=s.address||s.location||'';p.location=fmt66(s.address||p.location||'')}}}))}

  // 店舗検索結果を詳細カード化。OSM/Nominatimのextratagsに営業時間等があれば保存・表示する。
  function renderBiz66(rows,area,genre,style){
    return rows.map((c,i)=>{const hours=c.opening_hours||'';const website=c.website||'';const tags=[];if(c.type)tags.push(c.type);if(c.cuisine)tags.push(c.cuisine);if(style)tags.push(style);return `<div class="v66-biz"><div class="v66-biz-top"><div style="font-size:25px">${genre==='カフェ'?'☕':'🍴'}</div><div class="v66-biz-main"><h4>${esc66(c.name)}</h4><div class="addr">📍 ${esc66(c.address||'住所未取得')}</div><div class="v66-meta">${tags.slice(0,4).map(x=>`<span>${esc66(x)}</span>`).join('')}</div>${hours?`<div class="small" style="margin-top:6px">🕒 ${esc66(hours)}</div>`:''}${c.warning?`<div class="v66-warn">⚠️ ${esc66(c.warning)}</div>`:''}</div></div><div class="v66-actions"><button class="btn" onclick="v66UseBiz(${i},false)">＋ 行きたい</button><button class="btn secondary" onclick="v66UseBiz(${i},true)">🗓 この旅行に追加</button><a class="btn secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${escQ66(c.name+' '+(c.address||area))}">🗺️ 地図</a>${website?`<a class="btn secondary" target="_blank" rel="noopener" href="${esc66(website)}">🌐 公式サイト</a>`:'<button class="btn secondary" onclick="v66Details('+i+')">ℹ️ 店舗詳細</button>'}</div></div>`}).join('')}
  window.v66SearchBusinesses=async function(area,genre){const q=(document.getElementById('v65BusinessQuery')?.value||'').trim()||`${area} ${genre==='カフェ'?'カフェ':'グルメ'}`;const style=document.getElementById('v65BusinessStyle')?.value||'';const out=document.getElementById('v65SearchResults')||document.getElementById('v66SearchResults');if(!out)return;out.innerHTML='<div class="v66-panel">🔎 実在する店舗情報を検索しています…</div>';try{const query=[q,style].filter(Boolean).join(' ');const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=12&countrycodes=jp&addressdetails=1&extratags=1&q='+escQ66(query);const r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('search');const raw=await r.json();const rows=raw.filter(x=>x.name||x.display_name).map(x=>({name:x.name||x.display_name.split(',')[0],address:fmt66(x.display_name||''),lat:Number(x.lat),lon:Number(x.lon),prefecture:x.address?.state||'',city:x.address?.city||x.address?.town||x.address?.municipality||'',opening_hours:x.extratags?.opening_hours||'',website:x.extratags?.website||'',phone:x.extratags?.phone||'',cuisine:x.extratags?.cuisine||'',type:x.type||'',category:x.category||'',desc:'地図データから取得した店舗候補',style:style||genre}));window.__v66BizResults=rows;window.__v65SearchResults=rows;out.innerHTML=rows.length?renderBiz66(rows,area,genre,style):'<div class="v66-panel">候補が見つかりませんでした。店名や料理名を具体的にして再検索してください。</div>';if(typeof toast==='function')toast(`${rows.length}件の候補を見つけました`)}catch(e){out.innerHTML='<div class="v66-panel">店舗検索に失敗しました。時間を置いて再度お試しください。</div>'}};
  window.v66Details=function(i){const c=window.__v66BizResults?.[i];if(!c)return;openModal(`<div class="modal-head"><h2>${esc66(c.name)}</h2><button class="close" onclick="closeModal()">×</button></div><p>📍 ${esc66(c.address||'住所未取得')}</p>${c.opening_hours?`<p>🕒 ${esc66(c.opening_hours)}</p>`:'<p class="small">営業時間情報は取得できませんでした。訪問前に公式情報を確認してください。</p>'}${c.phone?`<p>☎️ ${esc66(c.phone)}</p>`:''}<div class="v66-actions"><button class="btn" onclick="closeModal();v66UseBiz(${i},false)">＋ 行きたい</button><button class="btn secondary" onclick="closeModal();v66UseBiz(${i},true)">🗓 この旅行に追加</button></div>`)};
  window.v66UseBiz=async function(i,addPlan){const c=window.__v66BizResults?.[i];if(!c)return;let s=(data.spots||[]).find(x=>x.name===c.name&&fmt66(x.address)===fmt66(c.address));if(!s){s={id:eid('spot'),name:c.name,prefecture:c.prefecture||'',category:(document.getElementById('v65Genre')?.value||'グルメ')==='カフェ'?ensureCat66('カフェ','☕'):ensureCat66('グルメ','🍴'),address:fmt66(c.address),location:fmt66(c.address),description:c.desc,oneLine:c.desc,memo:'店舗検索から追加',lat:c.lat,lon:c.lon,image:'',priority:4,favorite:true,visited:false,mealType:'昼食',opening_hours:c.opening_hours||'',website:c.website||'',phone:c.phone||'',cuisine:c.cuisine||''};data.spots.unshift(s)}else{s.favorite=true;s.address=fmt66(s.address||c.address);s.location=s.address||s.location||'';s.lat=s.lat||c.lat;s.lon=s.lon||c.lon;s.opening_hours=s.opening_hours||c.opening_hours||'';s.website=s.website||c.website||'';s.phone=s.phone||c.phone||''}await enrich66(s);if(addPlan){const t=trip();if(!t){closeModal();openTripModal();return}if(window.v64InsertMealPlan)window.v64InsertMealPlan(t,s,'昼食');else{t.plans=t.plans||[];t.plans.push({id:eid('plan'),spotId:s.id,title:s.name,date:t.startDate||today(),time:'12:00',mealType:'昼食',duration:60,location:s.address,cost:0,expenseCategory:'食費',order:t.plans.length})}save();closeModal();renderAll();switchPage('plan');toast(`${s.name}を昼食（12:00）として追加しました`)}else{save();closeModal();renderAll();switchPage('explore');toast(`${s.name}を「行きたい」に追加しました`)}};
  function ensureCat66(n,i){data.categories=data.categories||[];let c=data.categories.find(x=>x.name===n);if(c)return c.id;const id=eid('cat');data.categories.push({id,name:n,icon:i});return id}

  // 営業時間チェック：旅程の予定時刻が店舗営業時間から外れている場合に警告する。
  function parseHours66(h){if(!h)return null;const m=String(h).match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/);if(!m)return null;return {a:Number(m[1])*60+Number(m[2]),b:Number(m[3])*60+Number(m[4])}}
  function hoursWarning66(s,time){const r=parseHours66(s?.opening_hours);if(!r||!time)return '';const [h,m]=String(time).split(':').map(Number);const x=h*60+m;return x>=r.a&&x<=r.b?'':'設定時刻が営業時間外の可能性があります。公式情報を確認してください。'}
  function addHoursWarnings66(){(data.trips||[]).forEach(t=>(t.plans||[]).forEach(p=>{const s=spot66(p);if(s&&food66(s))p.hoursWarning=hoursWarning66(s,p.time)}))}
  window.v66CheckPlanHours=function(){normalizeMeals66();addHoursWarnings66();const t=trip();const bad=(t?.plans||[]).filter(p=>p.hoursWarning);openModal(`<div class="modal-head"><h2>🕒 営業時間チェック</h2><button class="close" onclick="closeModal()">×</button></div>${bad.length?`<div class="v66-warn">⚠️ ${bad.length}件、設定した食事時間と営業時間が合わない可能性があります。</div>${bad.map(p=>{const s=spot66(p);return `<div class="card" style="margin-top:8px"><b>${esc66(s?.name||p.title)}</b><p class="small">${esc66(p.date||'')} ${esc66(p.time||'')} ／ ${esc66(s?.opening_hours||'営業時間情報なし')}</p><button class="btn secondary" onclick="closeModal();editPlan('${esc66(p.id)}')">予定を確認</button></div>`}).join('')}`:'<div class="v66-panel">✅ 現在取得できている営業時間情報では、時間帯の明らかな矛盾はありません。営業時間情報が未登録の店舗は公式サイトで確認してください。</div>'}<p class="small" style="margin-top:10px">営業時間は変更される場合があります。予約・出発前には公式情報で最終確認してください。</p>`)};

  // OSRMで道路距離・所要時間を計算。公共交通はGoogle Mapsの経路案内へ。
  async function roadRoute66(points){if(points.length<2)return null;const coords=points.map(p=>`${p.lon},${p.lat}`).join(';');const u=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=false&steps=false`;const r=await fetch(u);if(!r.ok)throw Error('route');const j=await r.json();if(j.code!=='Ok')throw Error('route');return {distance:j.routes[0].distance,duration:j.routes[0].duration}};
  function km66(m){return (Number(m||0)/1000).toFixed(1)+' km'}
  function min66(sec){const m=Math.round(Number(sec||0)/60);return m<60?m+'分':Math.floor(m/60)+'時間'+(m%60?m%60+'分':'')}
  async function routeSummary66(t){
    const dep=t?.v64Departure||{};const origin={lat:Number(dep.lat),lon:Number(dep.lon)};
    if(!Number.isFinite(origin.lat)||!Number.isFinite(origin.lon))return null;
    const grouped={};(t.plans||[]).forEach(p=>{(grouped[p.date||'日付未定']??=[]).push(p)});
    const days=[];for(const date of Object.keys(grouped).sort()){const plans=grouped[date].sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));const points=[origin];for(const p of plans){const s=spot66(p);if(s&&Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lon)))points.push({lat:Number(s.lat),lon:Number(s.lon),name:s.name})}let end=null;if(dep.endMode==='fixed'&&Number.isFinite(Number(dep.endLat)))end={lat:Number(dep.endLat),lon:Number(dep.endLon)};else end=origin;if(end)points.push(end);try{const r=await roadRoute66(points);days.push({date,distance:r.distance,duration:r.duration,count:plans.length})}catch(e){days.push({date,distance:null,duration:null,count:plans.length})}}
    return {days,totalDistance:days.reduce((a,x)=>a+(x.distance||0),0),totalDuration:days.reduce((a,x)=>a+(x.duration||0),0)};
  }
  window.v66ShowRouteSummary=async function(){const t=trip();if(!t){toast('旅行を作成してください');return}const box=document.getElementById('v66RouteSummaryBox');if(box)box.innerHTML='🚗 日ごとの道路ルートを計算中…';const r=await routeSummary66(t);if(box)box.innerHTML=r?`${r.days.map(d=>`<div class="v66-route-card"><b>📅 ${esc66(d.date)}</b>${d.distance!=null?`<div class="v66-route-summary"><span>🚗 約${km66(d.distance)}</span><span>⏱️ 約${min66(d.duration)}</span><span>📍 ${d.count}件</span></div>`:'<div class="v66-warn">道路ルートを計算できませんでした</div>'}</div>`).join('')}<div class="v66-compact">合計：約${km66(r.totalDistance)} ／ 約${min66(r.totalDuration)}。渋滞・乗換時間は含まれません。</div>`:'<div class="v66-warn">道路ルートを計算できませんでした。Google Mapsで確認してください。</div>';return r}
  window.v66OpenDirections=function(){const t=trip();const dep=t?.v64Departure||{};const plans=[...(t?.plans||[])].filter(p=>spot66(p)).sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time));const q=[dep.text||'',...plans.map(p=>spot66(p)?.name||p.title),dep.endMode==='fixed'?(dep.endText||''):(dep.text||'')].filter(Boolean).join(' → ');window.open('https://www.google.com/maps/dir/?api=1&origin='+escQ66(dep.text||'')+'&destination='+escQ66((dep.endMode==='fixed'?dep.endText:dep.text)||'')+'&waypoints='+escQ66(plans.map(p=>spot66(p)?.name||p.title).join('|')),'_blank')}

  // 旅程生成をV66方式に差し替え。OSRMの道路最適化が使える場合はそれを利用し、日ごとの地域まとまりを優先する。
  async function optimize66(list,origin,end){

  function distribute66(ordered,days){const buckets=Array.from({length:days},()=>[]);if(!ordered.length)return buckets;const n=Math.ceil(ordered.length/days);ordered.forEach((s,i)=>buckets[Math.min(Math.floor(i/n),days-1)].push(s));return rebalanceMeals66(buckets)}
  function rebalanceMeals66(buckets){const warnings=[];for(let di=0;di<buckets.length-1;di++){let foods=buckets[di].filter(food66);while(foods.length>3){const idx=buckets[di].findIndex(s=>food66(s));if(idx<0)break;const moved=buckets[di].splice(idx,1)[0];buckets[di+1].unshift(moved);foods=buckets[di].filter(food66)}}const totalFood=buckets.flat().filter(food66).length;if(totalFood>3*buckets.length)warnings.push('食事候補が1日3枠を超えています。旅程作成後に時間を調整してください。');return buckets}
  function assignMeals66(buckets){const warnings=[];buckets.forEach((bucket,di)=>{const foods=bucket.filter(food66),others=bucket.filter(s=>!food66(s));if(foods.length>3){warnings.push(`Day ${di+1} に食事候補が${foods.length}件あります。1日3枠を超えるため一部は調整が必要です。`)}const mealMap={};foods.forEach((s,i)=>{const slot=mealSlots66[Math.min(i,2)];mealMap[s.id]=slot});bucket.splice(0,bucket.length,...others,...foods.sort((a,b)=>(mealTimes66[mealMap[a.id]]||'99:99').localeCompare(mealTimes66[mealMap[b.id]]||'99:99')));return mealMap}) ;return warnings}
  function buildPlans66(t,buckets,ds){t.plans=t.plans||[];const ids=new Set(buckets.flat().map(s=>s.id));t.plans=t.plans.filter(p=>!ids.has(p.spotId));const warnings=[];buckets.forEach((bucket,di)=>{const date=ds[di]||t.startDate||today();let normal=0;const foods=bucket.filter(food66),others=bucket.filter(s=>!food66(s));const placed=[];foods.forEach((s,i)=>placed.push({s,time:mealTimes66[mealSlots66[Math.min(i,2)]],meal:mealSlots66[Math.min(i,2)]}));others.forEach(s=>placed.push({s,time:['09:00','10:30','14:00','15:30','16:30','17:00'][Math.min(normal++,5)],meal:''}));placed.sort((a,b)=>a.time.localeCompare(b.time));placed.forEach((x,i)=>{const s=x.s;t.plans.push({id:eid('plan'),spotId:s.id,title:s.name,date,time:x.time,mealType:x.meal||undefined,duration:food66(s)?60:90,transport:'車',transportTime:0,location:fmt66(s.address||s.location||''),cost:0,memo:food66(s)?'🍴 '+x.meal+' ／ 店舗確定':'🧭 地理順＋道路ルート確認',done:false,order:t.plans.filter(p=>p.date===date).length,expenseCategory:food66(s)?'食費':'その他',reservation:'なし',hoursWarning:hoursWarning66(s,x.time)});});if(foods.length>3)warnings.push(`${date}: 食事枠が3件を超えています`)});return warnings}
  window.v66BuildPlan=async function(){const t=trip();if(!t){openTripModal();return}const fav=(data.spots||[]).filter(s=>s.favorite);if(!fav.length){toast('まず「行きたい場所」を登録してください');return}const originText=(document.getElementById('v64Origin')?.value||'').trim();if(!originText){toast('出発地点を設定してください');return}const status=document.getElementById('v64BuildStatus');if(status)status.textContent='🧭 店舗・施設の位置と道路ルートを確認しています…';t.v64Departure=t.v64Departure||{};t.v64Departure.text=originText;let origin={lat:Number(t.v64Departure.lat),lon:Number(t.v64Departure.lon)};if(!Number.isFinite(origin.lat)||!Number.isFinite(origin.lon)){const g=await geo66(originText);origin={lat:g.lat,lon:g.lon};t.v64Departure.lat=g.lat;t.v64Departure.lon=g.lon}const endMode=document.querySelector('[name="v65endmode"]:checked')?.value||t.v64Departure.endMode||'return';let end=null;if(endMode==='fixed'){const q=(document.getElementById('v65End')?.value||t.v64Departure.endText||'').trim();if(q){const g=await geo66(q);end={lat:g.lat,lon:g.lon};t.v64Departure.endText=q;t.v64Departure.endLat=g.lat;t.v64Departure.endLon=g.lon}}else end=origin;t.v64Departure.endMode=endMode;const spots=[];for(const s of fav.slice(0,30)){await enrich66(s);if(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lon)))spots.push(s)}if(!spots.length){toast('位置情報を取得できる場所がありませんでした');return}const ordered=await optimize66(spots,origin,end);const ds=typeof dates==='function'?dates(t):[];const days=ds.length||1;let buckets=distribute66(ordered,days);const warnings=buildPlans66(t,buckets,ds);normalizeMeals66();save();closeModal();renderAll();switchPage('plan');if(warnings.length)toast('旅程を作成しました。食事枠を確認してください');else toast('道路ルートを考慮した旅程を作成しました');setTimeout(()=>v66AttachPlanTools(),300)};
  window.generatePlan=window.v66BuildPlan;window.v64BuildOptimizedPlan=window.v66BuildPlan;

  const oldBuilder66=window.openV64PlanBuilder;
  window.openV64PlanBuilder=function(){oldBuilder66();setTimeout(()=>{const modal=document.getElementById('modal');if(!modal||modal.dataset.v66Builder)return;modal.dataset.v66Builder='1';const box=document.createElement('div');box.className='v66-panel';box.innerHTML='<div class="v66-section-title"><h3>🚗 ルート計算</h3><span class="tag">道路距離＋移動時間</span></div><p class="small">出発地・終了地点・各スポットの位置を使い、道路ルートを確認します。車の道路ルートが計算できない場合は、地理的な順番に切り替えます。</p><div id="v66RouteSummaryBox" class="v66-route-card">まだルートを計算していません。</div><div class="v66-actions"><button class="btn secondary" onclick="v66ShowRouteSummary()">🚗 ルートを確認</button><button class="btn secondary" onclick="v66OpenDirections()">🗺️ Google Mapsで確認</button></div></div>';modal.appendChild(box);const btn=[...modal.querySelectorAll('button')].find(b=>/出発地・終了地を基準に旅程を作る/.test(b.textContent||''));if(btn){btn.textContent='✨ 道路ルートを考慮して旅程を作る';btn.onclick=window.v66BuildPlan;btn.removeAttribute('onclick')}} ,0)};

  function attachPlanPanel66(){const box=document.getElementById('planList');if(!box||document.getElementById('v66PlanPanel'))return;const p=document.createElement('div');p.id='v66PlanPanel';p.className='v66-panel';p.innerHTML='<div class="v66-section-title"><h3>🧭 旅程チェック</h3></div><div id="v66RouteSummaryBox">道路ルートを計算できます。</div><div class="v66-actions"><button class="btn secondary" onclick="v66ShowRouteSummary()">🚗 移動距離・時間を確認</button><button class="btn secondary" onclick="v66CheckPlanHours()">🕒 営業時間を確認</button><button class="btn secondary full" onclick="v66OpenDirections()">🗺️ Google Mapsで全体を見る</button></div>';box.parentNode.insertBefore(p,box)}

  function noteDest66(n){const t=n?.tripId?(data.trips||[]).find(x=>x.id===n.tripId):null;return t?.destination||''}
  function noteIllustration66(dest){if(/京都|奈良/.test(dest))return '⛩️';if(/広島|尾道|岡山|牛窓/.test(dest))return '🌊';if(/北海道/.test(dest))return '🏔️';if(/沖縄/.test(dest))return '🌺';if(/長野|山梨/.test(dest))return '🏔️';return '🗺️'}
  window.v66OpenStampCollection=function(){const t=trip();const pref=t?.destination||'全国';openModal(`<div class="modal-head"><h2>📮 スタンプ・風景印コレクション</h2><button class="close" onclick="closeModal()">×</button></div><div class="v66-panel"><b>旅先：${esc66(pref)}</b><p class="small">旅先で集めた風景印・スタンプを、旅ノートの記念品として記録できます。</p><div class="v66-stamp-grid"><div class="v66-stamp-item">📮<br>風景印<br><small>地域の記念</small></div><div class="v66-stamp-item">🎫<br>チケット<br><small>思い出の半券</small></div><div class="v66-stamp-item">📍<br>旅先スタンプ<br><small>訪問記録</small></div></div></div><div class="v66-actions"><button class="btn" onclick="closeModal();openNoteModal()">＋ 旅ノートに記録</button><a class="btn secondary" target="_blank" rel="noopener" href="https://www.post.japanpost.jp/enjoy/culture/stamp/fuke/">📮 日本郵便「風景印」</a></div>`)};

<script>
(function(){
'use strict';
const V='67.0.0';
window.V67={version:V,services:{},utils:{}};

/* 1,35,36: canonical data model + migration without deleting old data */
function migrate(){
  data.schemaVersion=4;
  data.trips=(data.trips||[]).map(t=>{
    const route=t.route||{}; const dep=t.v64Departure||{};
    const r={mode:route.mode||t.transportMode||'car',origin:route.origin||{text:dep.text||'',lat:dep.lat??null,lon:dep.lon??null},end:route.end||{mode:dep.endMode||'return',text:dep.endText||'',lat:dep.endLat??null,lon:dep.endLon??null},buffer:Number(route.buffer??15)||15,days:Array.isArray(route.days)?route.days:[]};
    return {...t,schemaVersion:4,route:r,preferences:t.preferences||{},packing:Array.isArray(t.packing)?t.packing:[],plans:(t.plans||[]).map((p,i)=>({...p,order:Number.isFinite(p.order)?p.order:i,transport:p.transport||'未設定',travelMinutes:Number(p.travelMinutes||p.transportTime||0)||0,travelFrom:p.travelFrom||'',image:p.image||p.photo||'',photo:undefined}))};
  });
  data.notes=(data.notes||[]).map(n=>({...n,image:n.image||n.photo||'',photo:undefined,date:n.date||today(),place:n.place||'',weather:n.weather||'',mood:n.mood||'',ticket:n.ticket||'',stamp:n.stamp||null,illustration:n.illustration!==false}));
  save();
}
migrate();

/* 32: IndexedDB photo store, keeping image data as fallback for compatibility */
V67.services.photos={db:null,ready:null,open(){if(this.ready)return this.ready;this.ready=new Promise((res,rej)=>{if(!('indexedDB' in window)){res(null);return}const q=indexedDB.open('travel_note_v67',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('photos'))q.result.createObjectStore('photos')};q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>res(null)});return this.ready},async put(id,dataUrl){const db=await this.open();if(!db)return;return new Promise(r=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(dataUrl,id);tx.oncomplete=()=>r(true);tx.onerror=()=>r(false)})},async get(id){const db=await this.open();if(!db)return '';return new Promise(r=>{const tx=db.transaction('photos','readonly'),q=tx.objectStore('photos').get(id);q.onsuccess=()=>r(q.result||'');q.onerror=()=>r('')})}};

/* 34: services are isolated so providers can be swapped later */
V67.services.geocode={async search(q){return await geocode64(q)},async reverse(lat,lon){try{const u='https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon);const r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw Error();const j=await r.json();return {label:j.display_name||'',lat,lon}}catch(e){return {label:'',lat,lon}}}};
V67.services.places={provider:'osm',note:'店舗検索はユーザー操作時に実行。将来Places等へ交換可能。'};
V67.services.route={modeLabel:m=>({car:'🚗 車',trainbus:'🚆 電車・バス',shinkansen:'🚄 新幹線',walk:'🚶 徒歩',bike:'🚲 自転車'})[m]||'🚗 車',distanceKm(a,b){if(!a||!b)return 0;const R=6371,la=(b.lat-a.lat)*Math.PI/180,lo=(b.lon-a.lon)*Math.PI/180;const x=Math.sin(la/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(lo/2)**2;return 2*R*Math.asin(Math.sqrt(x))},estimate(a,b,mode){const d=this.distanceKm(a,b);const speed={car:45,trainbus:35,shinkansen:120,walk:4.5,bike:15}[mode]||45;return Math.max(3,Math.round(d/speed*60+5))}};
V67.services.weather={label:w=>w||'天気を記録'};
V67.services.storage={backup(){const payload=JSON.stringify({...data,backupVersion:V,backedUpAt:new Date().toISOString()});const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(payload);a.download='travel_note_v67_backup.json';a.click()}};

/* 2: safe page switching; notes/trips are logical destinations, not pages */

window.switchPage=function(p){if(p==='notes'){switchPage('mypage');setTimeout(()=>openNoteModal(),0);return}if(p==='trips'){switchPage('mypage');setTimeout(()=>openTripDashboard(),0);return}if(!document.getElementById('page-'+p)){p='home'}oldSwitch(p);};

/* 4,5,26,43,52: current-trip scope helpers */
function currentSpotIds(t){const ids=new Set((t?.plans||[]).map(p=>p.spotId).filter(Boolean));return ids}
function currentSpots(t){const ids=currentSpotIds(t);return (data.spots||[]).filter(s=>ids.has(s.id))}

window.V67.currentSpots=currentSpots;

/* 3,33: PWA cache points to V67 SW */
window.addEventListener('load',()=>{if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./travel_note_v71_sw.js').catch(()=>{})}});

/* 8: version labels */
setTimeout(()=>{document.querySelectorAll('[id*=version],[class*=version]').forEach(e=>{if(/V6[0-6]|V60|V66/.test(e.textContent))e.textContent=e.textContent.replace(/V6[0-6]/g,'V67')});},50);

/* 9,14,15: terminology cleanup */
function textCleanup(){document.querySelectorAll('button,.btn,.chip,h1,h2,h3,h4,p,span,div').forEach(e=>{if(e.children.length===0){e.textContent=e.textContent.replaceAll('旅行を管理','旅行全体').replaceAll('登録済みスポット','保存した場所').replaceAll('登録済み','保存済み')}})}

/* 10: one AI hub */

/* 20,21,22: route engine: cluster by region/day, meal-hour validation, travel time timeline */
function dayList(t){return typeof dates==='function'?dates(t):[]}
function coords(s){return Number.isFinite(Number(s?.lat))&&Number.isFinite(Number(s?.lon))?{lat:Number(s.lat),lon:Number(s.lon)}:null}
function regionKey(s){return String(s?.prefecture||'')+'|'+String((s?.address||'').match(/市|区|町|村/)?.index||'')}
function distributeRegional(spots,ds,origin){const buckets=ds.map(()=>[]);if(!buckets.length)return buckets;const groups={};spots.forEach(s=>(groups[s.prefecture||'未設定']??=[]).push(s));const keys=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);let bi=0;for(const k of keys){for(const s of groups[k]){buckets[bi%buckets.length].push(s);bi++}}// re-order each bucket geographically
buckets.forEach((arr,i)=>{let cur=i===0?origin:null;const rem=arr.slice(),out=[];while(rem.length){let best=0,bd=Infinity;rem.forEach((s,j)=>{const c=coords(s);if(!c){if(bd===Infinity)best=j;return}const d=cur?V67.services.route.distanceKm(cur,c):0;if(d<bd){bd=d;best=j}});const s=rem.splice(best,1)[0];out.push(s);cur=coords(s)||cur}arr.splice(0,arr.length,...out)});return buckets}
function foodOpen(s,time){const h=String(s?.opening_hours||'');if(!h)return true;const m=String(time).match(/^(\d{2}):(\d{2})/);if(!m)return true;const mins=+m[1]*60+ +m[2];const rg=h.match(/(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/);if(!rg)return true;const a=rg[1].split(':').map(Number),b=rg[2].split(':').map(Number);return mins>=a[0]*60+a[1]&&mins<=b[0]*60+b[1]}
function slotForFood(s,used){for(const slot of ['昼食','朝食','夕食']){if(!used.has(slot)&&foodOpen(s,mealTimes[slot]))return slot}return used.size<3?['昼食','朝食','夕食'][used.size]:'昼食'}
window.v67BuildPlan=async function(){const t=trip();if(!t){openTripModal();return}if(!t.route?.origin?.text){openV67RouteSettings();toast('先に出発地点を設定してください');return}const fav=data.spots.filter(s=>s.favorite);if(!fav.length){switchPage('explore');toast('まず「行きたい」を追加してください');return}const ds=dayList(t);if(!ds.length){toast('旅行日程を設定してください');return}for(const s of fav.slice(0,24)){try{if(!coords(s))await enrichSpot64(s)}catch(e){}}const o=coords(t.route.origin);const groups=distributeRegional(fav.filter(s=>coords(s)),ds,o);t.plans=(t.plans||[]).filter(p=>!fav.some(s=>s.id===p.spotId));const plans=[];groups.forEach((arr,di)=>{let cur=o;const used=new Set();let clock=8*60;arr.forEach((s,idx)=>{const c=coords(s);const travel=cur&&c?V67.services.route.estimate(cur,c,t.route.mode):0;if(idx===0)clock=Math.max(clock,8*60);clock+=travel;let slot='',time='';if(isFoodSpot(s)){slot=slotForFood(s,used);used.add(slot);time=mealTimes[slot];clock=+time.slice(0,2)*60+ +time.slice(3);if(!foodOpen(s,time))time=mealTimes[slot]}else{time=String(Math.floor(clock/60)).padStart(2,'0')+':'+String(clock%60).padStart(2,'0')}const date=ds[di];plans.push({id:eid('plan'),spotId:s.id,title:s.name,date,time,mealType:slot||undefined,duration:isFoodSpot(s)?60:90,transport:V67.services.route.modeLabel(t.route.mode),transportMode:t.route.mode,travelMinutes:travel,transportTime:travel,travelFrom:cur?`${cur.lat.toFixed(4)},${cur.lon.toFixed(4)}`:'',location:formatAddress(s.address||s.location||''),cost:0,memo:isFoodSpot(s)?'🍴 食事枠（07:00 / 12:00 / 18:00）':'📍 地域をまとめて配置',done:false,order:plans.filter(p=>p.date===date).length,expenseCategory:isFoodSpot(s)?'食費':'その他',reservation:'なし'});cur=c||cur;clock+=isFoodSpot(s)?60:90})});t.plans=plans;save();closeModal();renderAll();switchPage('plan');toast('地域・移動手段・食事時間を考慮して旅程を作成しました')};
