.v69-more-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.v69-note{font-size:12px;color:var(--muted,#6b7280);margin:6px 0 0}
@media(max-width:560px){.v69-more-grid{grid-template-columns:1fr}}
</style>
<script id="v69-ledger-cleanup">
(function(){
  const hideLabels=[
    '旅行情報センター','AI旅行プランナー','旅行プラン診断',
    '旅行プランを診断','3つの旅程を比較','3つの旅程から選ぶ',
    '旅行コンシェルジュ'
  ];
  const renameMap=[
    [/旅行を管理/g,'旅行全体'],
    [/登録済み/g,'保存した場所'],
    [/旅程を調整する/g,'旅程を整える'],
    [/旅程の調整/g,'旅程を整える']
  ];
  function normalizeText(root=document){
    root.querySelectorAll('button,h1,h2,h3,h4,label,p,span,a').forEach(el=>{
      if(!el.childNodes.length) return;
      // Avoid changing icon-only controls and code-like content.
      const txt=el.textContent||'';
      if(!txt.trim()) return;
      let next=txt;
      renameMap.forEach(([a,b])=>next=next.replace(a,b));
      if(next!==txt && el.children.length===0) el.textContent=next;
    });
  }
  function removeDuplicateEntryButtons(root=document){
    root.querySelectorAll('button').forEach(b=>{
      const t=(b.textContent||'').replace(/\s+/g,' ').trim();
      if(!t) return;
      // These are alternate entry points, not the underlying functions.
      if(hideLabels.some(x=>t===x || t.startsWith(x+' ') || t.includes(x))){
        b.classList.add('v69-secondary-entry-hidden');
      }
      if(t.includes('コンパクト表示')) b.classList.add('v69-secondary-entry-hidden');
    });
  }
  function addCss(){
    if(document.getElementById('v69-runtime-style')) return;
    const st=document.createElement('style');st.id='v69-runtime-style';
    st.textContent='.v69-secondary-entry-hidden{display:none!important}';
    document.head.appendChild(st);
  }

  // One control surface for itinerary tools. The underlying functions remain available.
  window.openPlanTools68=function(){
    const t=(typeof currentTrip68==='function'?currentTrip68():typeof trip==='function'?trip():null);
    if(!t){ if(typeof notify68==='function')notify68('先に旅行を作成してください。'); else if(typeof toast==='function')toast('先に旅行を作成してください。'); if(typeof openTripModal==='function')openTripModal(); return; }
    openModal(`<div class="modal-head"><h2>🧭 旅程を整える</h2><button class="close" onclick="closeModal()" aria-label="閉じる">×</button></div>
      <p class="small">旅程に関する操作をここにまとめています。必要なものだけ選んでください。</p>
      <div class="v68-tool-grid">
        <button class="btn" onclick="closeModal();openV67RouteSettings()">📍 <b>移動・出発設定</b><small>出発・終了・移動手段</small></button>
        <button class="btn" onclick="closeModal();v67BuildPlan()">✨ <b>自動で旅程を作る</b><small>地域と移動時間を考慮</small></button>
        <button class="btn secondary" onclick="closeModal();optimizeAllDays()">🧭 <b>順番を整える</b><small>効率のよい順に整理</small></button>
        <button class="btn secondary" onclick="closeModal();openPlanCompare()">🪄 <b>旅程案を比較</b><small>候補を比べる</small></button>
        <button class="btn secondary" onclick="closeModal();suggestMeals()">🍴 <b>食事を調整</b><small>朝・昼・夕食を整理</small></button>
        <button class="btn secondary" onclick="closeModal();openRainPlan()">☔ <b>雨の日プラン</b><small>雨の場合の代替案</small></button>
        <button class="btn secondary" onclick="closeModal();openTripHealth()">🩺 <b>旅程チェック</b><small>問題点を確認</small></button>
        <button class="btn secondary" onclick="closeModal();openConcierge()">✨ <b>旅程を提案</b><small>お気に入りから組み直す</small></button>
      </div>
      <details class="v69-more-tools">
        <summary>＋ その他の機能</summary>
        <p class="v69-note">普段は使わない機能をここにまとめています。</p>
        <div class="v69-more-grid">
          <button class="btn secondary" onclick="closeModal();openInfoCenter()">🌐 最新情報を調べる</button>
          <button class="btn secondary" onclick="closeModal();openPacking()">🎒 持ち物リスト</button>
          <button class="btn secondary" onclick="closeModal();openAIPlanner()">✨ AI旅行プランナー</button>
          <button class="btn secondary" onclick="closeModal();openAIHub67()">💬 AIに相談</button>
        </div>
      </details>`);
  };

  // Keep the home focused on the next action. Important functions remain in their dedicated pages.
  window.renderHome=function(){
    const b=document.getElementById('homeTrip'); if(!b)return;
    const t=(typeof currentTrip68==='function'?currentTrip68():typeof trip==='function'?trip():null);
    if(!t){
      b.innerHTML=`<div class="v68-home-hero"><div class="v68-kicker">WELCOME</div><h2>旅ノートへようこそ</h2><p>まず旅行を1つ作るところから始めます。</p>
      <button class="btn" onclick="openTripModal()">🧳 旅行を作る</button>
      <button class="btn secondary" style="margin-top:8px" onclick="openV67Guide()">❓ 使い方を見る</button></div>`;
      return;
    }
    const plans=t.plans||[], next=plans.find(p=>!p.done), done=plans.filter(p=>p.done).length;
    const pct=plans.length?Math.round(done/plans.length*100):0;
    const step=!t.destination?'行き先を設定':(!t.startDate||!t.endDate?'日程を設定':(!t.route?.origin?.text?'出発地点を設定':(!plans.length?'旅程を作る':(next?'次の予定を確認':'旅を記録する'))));
    let action='';
    if(step==='行き先を設定'||step==='日程を設定') action=`<button class="btn" onclick="openTripModal()">🧳 ${step}</button>`;
    else if(step==='出発地点を設定') action=`<button class="btn" onclick="openV67RouteSettings()">📍 出発地点を設定</button>`;
    else if(step==='旅程を作る') action=`<button class="btn" onclick="switchPage('plan')">🗓️ 旅程を作る</button>`;
    else if(step==='次の予定を確認') action=`<button class="btn" onclick="openTravelMode()">📱 次の予定を確認</button>`;
    else action=`<button class="btn" onclick="switchPage('mypage')">📖 旅を記録する</button>`;
    b.innerHTML=`<div class="v68-home-hero"><div class="v68-kicker">NEXT ACTION</div><h2>${step}</h2><p>迷ったら、まずここから進めてください。</p>${action}
      <div class="v68-progress"><div><span>旅の進み具合</span><b>${pct}%</b></div><i><em style="width:${pct}%"></em></i></div></div>
      <div class="v68-home-links">
        <button class="btn secondary" onclick="switchPage('explore')">🔎 スポットを探す</button>
        <button class="btn secondary" onclick="switchPage('plan')">🗓️ 旅行プラン</button>
        <button class="btn secondary" onclick="openTripDashboard()">🧭 旅行全体</button>
        <button class="btn secondary" onclick="switchPage('mypage')">📖 記録</button>
      </div>
      <div class="v68-unified"><b>初めての方へ</b><p class="small">旅行を作る → スポットを探す → 旅程を作る → 旅行中モード → 記録、の順に進めます。</p>
      <button class="btn secondary full" onclick="openV67Guide()">❓ 使い方</button></div>`;
  };

  let cleaning=false;
  function clean(){
    if(cleaning)return;
    cleaning=true;
    addCss();
    normalizeText();
    removeDuplicateEntryButtons();
    document.querySelectorAll('.v60-primary-action').forEach(x=>x.remove());
    // Remove the old compact-setting row wherever it was injected.
    document.querySelectorAll('button,label,div,p').forEach(el=>{
      if((el.textContent||'').trim()==='コンパクト表示') el.remove();
    });
    cleaning=false;
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',clean,{once:true}); else clean();
  const mo=new MutationObserver(()=>{if(!cleaning)clean()});
  mo.observe(document.body,{childList:true,subtree:true});
})();
</script>

</body></html>
