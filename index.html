function tripPrepStats(t){
 const plans=t?.plans||[], done=plans.filter(p=>p.done).length;
 const packing=t?.packing||[], packed=packing.filter(x=>x.done).length;
 const fav=data.spots.filter(s=>s.favorite);
 const hasDates=!!(t?.startDate&&t?.endDate&&t.endDate>=t.startDate);
 const hasDestination=!!String(t?.destination||'').trim();
 const hasPlans=plans.length>0;
 const hasBudget=Number(t?.budget||0)>0;
 const checks=[
  {ok:hasDestination,label:'行き先を設定'},
  {ok:hasDates,label:'旅行日程を設定'},
  {ok:fav.length>0,label:'行きたい場所を登録'},
  {ok:hasPlans,label:'旅程を作成'},
  {ok:hasBudget,label:'予算を設定'},
  {ok:packing.length>0,label:'持ち物を準備'}
 ];
 return {plans,done,packing,packed,checks,percent:Math.round(checks.filter(x=>x.ok).length/checks.length*100)};
}

function icsEscape(v){return String(v||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsDate(date,time){const [y,m,d]=String(date||today()).split('-');const [hh,mm]=String(time||'10:00').split(':');return `${y}${m}${d}T${hh}${mm}00`}
function exportTripICS(){
 const t=trip(); if(!t)return; const plans=(t.plans||[]).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||'')));
 if(!plans.length){toast('カレンダーに保存する予定がありません');return}
 const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tabinote//Travel Note//JP','CALSCALE:GREGORIAN'];
 plans.forEach((p,i)=>{const dt=icsDate(p.date,p.time);const end=new Date(`${p.date||today()}T${p.time||'10:00'}:00`);end.setHours(end.getHours()+1);const e=`${end.getFullYear()}${String(end.getMonth()+1).padStart(2,'0')}${String(end.getDate()).padStart(2,'0')}T${String(end.getHours()).padStart(2,'0')}${String(end.getMinutes()).padStart(2,'0')}00`;const sp=p.spotId?data.spots.find(s=>s.id===p.spotId):null;lines.push('BEGIN:VEVENT',`UID:${icsEscape(p.id||('plan'+i))}@tabinote`,`DTSTART:${dt}`,`DTEND:${e}`,`SUMMARY:${icsEscape(p.title)}`,`LOCATION:${icsEscape(sp?.address||t.destination||'')}`,`DESCRIPTION:${icsEscape(p.memo||'')}`,'END:VEVENT')});lines.push('END:VCALENDAR');
 const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(t.name||'旅ノート')+'.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('カレンダーファイルを作成しました')
}
async function shareTripPlan(){

 try{if(navigator.share){await navigator.share({title:t.name,text});toast('共有画面を開きました');return}}catch(e){if(e?.name==='AbortError')return}

function v16TripHealth(t){
 const plans=t?.plans||[], fav=data.spots.filter(s=>s.favorite), missing=[];
 if(!t?.destination)missing.push('行き先');
 if(!t?.startDate||!t?.endDate)missing.push('旅行日程');
 if(!fav.length)missing.push('行きたい場所');
 if(!plans.length)missing.push('旅程');
 const noInfo=fav.filter(s=>!s.lat||!s.lon).length;
 if(noInfo)missing.push('場所情報');
 const bud=+t?.budget||0, planned=plans.reduce((n,p)=>n+(+p.cost||0),0);
 if(bud&&planned>bud)missing.push('予算');
 const score=Math.max(0,100-missing.length*14-(noInfo?8:0));
 return {missing,score,planned,bud};
}

}

async function photoData(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1100,sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}

function openSpotModal(sid=null){const s=sid?data.spots.find(x=>x.id===sid):null;window._spotRating=s?.rating||0;window._wikiDescription=s?.wikiDescription||'';window._wikiCandidates=[];openModal(`<div class="modal-head"><h2>${s?'場所を編集':'行きたい場所を追加'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="group"><label>場所の名前 *</label><input id="spotName" class="field" value="${esc(s?.name||'')}" placeholder="例：東京ディズニーランド"></div><div class="auto"><button id="lookup" class="btn full" onclick="lookup()">✨ 場所情報を自動取得</button><div id="status" class="status"></div><div class="small">※入力後にボタンを押したときだけ検索します。</div></div><div class="auto" style="margin-top:8px"><button class="btn secondary full" type="button" onclick="lookupWiki()">📚 Wikipediaから説明・写真を自動取得</button><div id="wikiStatus" class="status"></div><div class="small">見つかった場合だけ候補を表示し、採用するか選べます。</div></div><div class="group"><label>写真</label><div id="preview" class="photo">${s?.image?`<img src="${esc(s.image)}" alt="">`:'📷 写真を追加すると表示されます'}</div><input id="photo" type="file" accept="image/*" onchange="preview(this)"><div class="small">スマホの写真をこの場所の画像として保存します。</div></div><div class="row"><div class="group"><label>都道府県</label><select id="spotPref" class="field"><option value="">選択してください</option>${PREF.map(p=>`<option value="${p}" ${s?.prefecture===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="group"><label>カテゴリー</label><select id="spotCat" class="field">${data.categories.map(c=>`<option value="${c.id}" ${s?.category===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></div></div><div class="group"><label>住所</label><input id="spotAddress" class="field" value="${esc(s?.address||'')}"></div><input id="spotLat" type="hidden" value="${esc(s?.lat||'')}"><input id="spotLon" type="hidden" value="${esc(s?.lon||'')}"><input id="spotWikiImage" type="hidden" value="${esc(s?.wikiImage||'')}"><input id="spotWikiUrl" type="hidden" value="${esc(s?.wikiUrl||'')}"><div id="wikiPreview" class="wiki-card" style="display:${s?.wikiImage||s?.wikiDescription?'block':'none'}">${s?.wikiImage?`<img src="${esc(s.wikiImage)}" alt="Wikipediaの画像">`:''}${s?.wikiDescription?`<p class="small" style="margin:8px 0 0">${esc(s.wikiDescription)}</p>`:''}${s?.wikiUrl?`<div class="wiki-credit"><a target="_blank" rel="noopener" href="${esc(s.wikiUrl)}">Wikipediaの記事を確認</a></div>`:''}</div><div class="group"><label>説明</label><textarea id="spotDesc" class="field textarea">${esc(s?.description||'')}</textarea></div><div class="row"><div class="group"><label>営業時間</label><input id="spotHours" class="field" value="${esc(s?.hours||'')}" placeholder="例：9:00〜18:00"></div><div class="group"><label>料金・目安</label><input id="spotPrice" class="field" value="${esc(s?.price||'')}" placeholder="例：大人1,000円〜"></div></div><div class="group"><label>公式サイト</label><input id="spotUrl" class="field" type="url" value="${esc(s?.url||'')}" placeholder="https://..."></div><div class="group"><label>自分の評価</label><div class="choice-row" id="spotRating">${[1,2,3,4,5].map(n=>`<button type="button" class="choice ${n===(s?.rating||0)?'on':''}" data-v="${n}" onclick="selectRating(${n})">${n} ★</button>`).join('')}</div></div><div class="group"><label>一言メモ</label><input id="spotOneLine" class="field" maxlength="60" value="${esc(s?.oneLine||'')}" placeholder="例：朝早く行きたい・絶対食べたい！"><div class="small">一覧にも表示される短いメモです。</div></div><div class="group"><label>詳しいメモ</label><textarea id="spotMemo" class="field textarea" placeholder="調べたことや自分用のメモを残せます。">${esc(s?.memo||'')}</textarea></div><button class="btn full" onclick="saveSpot('${s?.id||''}')">保存する</button>`)}
async function lookupWiki(){
 const name=document.getElementById('spotName').value.trim(),st=document.getElementById('wikiStatus'),box=document.getElementById('wikiPreview');
 if(!name){toast('先に場所の名前を入力してください');return}
 st.textContent='Wikipediaを検索中…';
 try{
  const q=encodeURIComponent(name);const sr=await fetch('https://ja.wikipedia.org/w/rest.php/v1/search/page?q='+q+'&limit=3');
  if(!sr.ok)throw 0;const sj=await sr.json();const pages=sj.pages||[];
  if(!pages.length){st.textContent='候補が見つかりませんでした。';return}
  const candidates=pages.slice(0,3);
  const rows=candidates.map((x,i)=>`<button type="button" class="btn secondary full" style="margin-top:6px;text-align:left" onclick="applyWiki(${i})"><b>${esc(x.title||'候補')}</b><br><span class="small">${esc((x.description||x.excerpt||'').replace(/<[^>]+>/g,''))}</span></button>`).join('');
  window._wikiCandidates=candidates;st.textContent='候補を選んでください。';
  box.style.display='block';box.innerHTML='<b>📚 Wikipedia候補</b>'+rows;
 }catch(e){st.textContent='Wikipedia情報を取得できませんでした。';toast('通信環境を確認してください')}
}
async function applyWiki(i){
 const x=(window._wikiCandidates||[])[i];if(!x)return;const title=x.key||x.title;const box=document.getElementById('wikiPreview'),st=document.getElementById('wikiStatus');st.textContent='記事情報を取得中…';
 try{
  const r=await fetch('https://ja.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));if(!r.ok)throw 0;const j=await r.json();
  const image=j.thumbnail?.source||'';const desc=j.description||j.extract||'';const url=j.content_urls?.desktop?.page||('https://ja.wikipedia.org/wiki/'+encodeURIComponent(j.title||title));
  document.getElementById('spotWikiImage').value=image;document.getElementById('spotWikiUrl').value=url;
  document.getElementById('spotDesc').value=document.getElementById('spotDesc').value.trim()||desc;
  box.style.display='block';box.innerHTML=`<b>📚 採用したWikipedia情報</b>${image?`<img src="${esc(image)}" alt="">`:''}<p class="small" style="white-space:pre-wrap">${esc(desc)}</p><div class="wiki-credit"><a target="_blank" rel="noopener" href="${esc(url)}">Wikipediaの記事を確認</a></div>`;window._wikiDescription=desc;st.textContent='✓ 説明と写真をセットしました。';toast('Wikipedia情報を反映しました')
 }catch(e){st.textContent='記事情報の取得に失敗しました。'}
}

async function saveSpot(sid){const name=document.getElementById('spotName').value.trim();if(!name){toast('場所の名前を入力してください');return}const old=sid?data.spots.find(x=>x.id===sid):null;const duplicate=data.spots.find(x=>x.id!==sid&&x.name.trim().toLowerCase()===name.toLowerCase());if(duplicate&&!confirm('同じ名前の場所がすでに登録されています。別の場所として保存しますか？'))return;let image=old?.image||'';const f=document.getElementById('photo').files?.[0];if(f){try{image=await photoData(f)}catch(e){toast('写真を読み込めませんでした');return}}const o={id:sid||eid('spot'),name,prefecture:document.getElementById('spotPref').value,category:document.getElementById('spotCat').value,address:document.getElementById('spotAddress').value.trim(),description:document.getElementById('spotDesc').value.trim(),hours:document.getElementById('spotHours').value.trim(),price:document.getElementById('spotPrice').value.trim(),url:document.getElementById('spotUrl').value.trim(),rating:window._spotRating||old?.rating||0,oneLine:document.getElementById('spotOneLine').value.trim(),memo:document.getElementById('spotMemo').value.trim(),lat:document.getElementById('spotLat').value,lon:document.getElementById('spotLon').value,wikiImage:document.getElementById('spotWikiImage')?.value||old?.wikiImage||'',wikiUrl:document.getElementById('spotWikiUrl')?.value||old?.wikiUrl||'',wikiDescription:window._wikiDescription||old?.wikiDescription||'',image,priority:old?.priority||3,favorite:sid?!!old.favorite:true,visited:!!old?.visited};if(sid){data.spots[data.spots.findIndex(x=>x.id===sid)]=o}else data.spots.unshift(o);if(save()){closeModal();renderAll();toast('保存しました')}}function editSpot(id){closeModal();setTimeout(()=>openSpotModal(id),100)}function deleteSpot(id){if(!confirm('この場所を削除しますか？'))return;data.spots=data.spots.filter(x=>x.id!==id);data.trips.forEach(t=>t.plans=(t.plans||[]).filter(p=>p.spotId!==id));save();closeModal();renderAll();toast('削除しました')}
function openTripModal(id=null){const t=id?data.trips.find(x=>x.id===id):null;openModal(`<div class="modal-head"><h2>${t?'旅行を編集':'新しい旅行'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="group"><label>旅行名 *</label><input id="tn" class="field" value="${esc(t?.name||'')}" placeholder="例：京都旅行"></div><div class="group"><label>行き先</label><input id="td" class="field" value="${esc(t?.destination||'')}" placeholder="例：京都府"></div><div class="row"><div class="group"><label>出発日</label><input id="ts" type="date" class="field" value="${t?.startDate||today()}"></div><div class="group"><label>帰宅日</label><input id="te" type="date" class="field" value="${t?.endDate||today()}"></div></div><div class="row"><div class="group"><label>人数</label><input id="tp" type="number" min="1" class="field" value="${t?.people||1}"></div><div class="group"><label>予算</label><input id="tb" type="number" min="0" class="field" value="${t?.budget||0}"></div></div><div class="group"><label>主な交通手段（旅行ごとに選択）</label><select id="tt" class="field"><option value="未設定" ${(t?.transport||'未設定')==='未設定'?'selected':''}>未設定</option><option value="車" ${t?.transport==='車'?'selected':''}>車</option><option value="電車・バス" ${t?.transport==='電車・バス'?'selected':''}>電車・バス</option><option value="徒歩・自転車" ${t?.transport==='徒歩・自転車'?'selected':''}>徒歩・自転車</option><option value="組み合わせ" ${t?.transport==='組み合わせ'?'selected':''}>組み合わせ</option></select></div><button class="btn full" onclick="saveTrip('${t?.id||''}')">保存する</button>${t?`<br><button class="btn secondary full" onclick="completeTrip('${t.id}')">✅ この旅行を完了して旅ノートを作る</button><br><button class="btn danger full" onclick="deleteTrip('${t.id}')">削除</button>`:''}`)}

function saveTrip(id){const n=document.getElementById('tn').value.trim(),sd=document.getElementById('ts').value,ed=document.getElementById('te').value;if(!n){toast('旅行名を入力してください');return}if(ed<sd){toast('旅行終了日は出発日以降にしてください');return}const old=id?data.trips.find(x=>x.id===id):null;const o={...(old||{}),id:id||eid('trip'),name:n,destination:document.getElementById('td').value.trim(),startDate:sd,endDate:ed,people:+document.getElementById('tp').value||1,budget:+document.getElementById('tb').value||0,transport:document.getElementById('tt')?.value||old?.transport||'未設定',plans:old?.plans||[],status:old?.status||'planned',expenses:old?.expenses||[],schemaVersion:4};if(id)data.trips[data.trips.findIndex(x=>x.id===id)]=o;else{data.trips.push(o);data.selectedTrip=o.id}save();closeModal();renderAll();toast('旅行を保存しました（設定は保持されます）')}function deleteTrip(id){if(!confirm('この旅行を削除しますか？'))return;data.trips=data.trips.filter(x=>x.id!==id);if(data.selectedTrip===id)data.selectedTrip=data.trips[0]?.id||null;save();closeModal();renderAll();toast('削除しました')}function selectTrip(id){data.selectedTrip=id;save();switchPage('plan')}

function normalizeBackup(x){const raw=x?.app==='旅ノート'?x.data:x;if(!raw||!Array.isArray(raw.spots)||!Array.isArray(raw.trips)||!Array.isArray(raw.notes))throw new Error('invalid');const y={...copy(DEFAULT),...raw};y.schemaVersion=3;y.categories=Array.isArray(y.categories)&&y.categories.length?y.categories:copy(DEFAULT.categories);y.spots=y.spots.map(s=>({...s,oneLine:s.oneLine??(s.memo||''),priority:Number(s.priority)||3,favorite:!!s.favorite,visited:!!s.visited}));y.trips=y.trips.map(t=>({...t,status:t.status||'planned',destination:t.destination||'',people:Number(t.people)||1,budget:Number(t.budget)||0,expenses:Array.isArray(t.expenses)?t.expenses:[],packing:Array.isArray(t.packing)?t.packing:[],plans:(t.plans||[]).map((p,i)=>({...p,expenseCategory:p.expenseCategory||'その他',transport:p.transport||'未設定',done:!!p.done,order:Number.isFinite(p.order)?p.order:i}))}));y.notes=y.notes.map(n=>({...n,image:n.image||'',date:n.date||today()}));y.selectedTrip=y.selectedTrip&&y.trips.some(t=>t.id===y.selectedTrip)?y.selectedTrip:(y.trips[0]?.id||null);return y}

function optimizeDay(date){const t=trip();if(!t)return;const items=(t.plans||[]).filter(p=>(p.date||'')===date);if(items.length<2){toast('この日の予定が2件以上必要です');return}const spots=items.map(p=>data.spots.find(s=>s.id===p.spotId)).filter(Boolean);const ordered=smartOrder(spots,'near');let cursor=0;ordered.forEach((s,i)=>{const p=items.find(x=>x.spotId===s.id);if(!p)return;p.order=i;p.time=['09:00','11:30','14:00','16:30','19:00'][Math.min(i,4)]||'10:00'});save();renderPlan();toast('この日の順番と時間を整えました')}

function v61TimeToMin(v){const m=String(v||'').match(/^(\d{1,2}):([0-5]\d)$/);return m?Number(m[1])*60+Number(m[2]):null}

function selectChoice(btn,id){document.querySelectorAll('#'+id+' .choice').forEach(x=>x.classList.remove('on'));btn.classList.add('on')}

function selectedMultiChoices(id){return [...document.querySelectorAll('#'+id+' .choice.on')].map(x=>x.dataset.v)}
function selectedChoice(id){return document.querySelector('#'+id+' .choice.on')?.dataset.v||''}
function tripDates(t){const out=[];if(t.startDate&&t.endDate){let d=new Date(t.startDate+'T00:00:00'),end=new Date(t.endDate+'T00:00:00');while(d<=end&&out.length<30){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}}return out.length?out:[t.startDate||today()]}
function spotDistance(a,b){if(a?.lat&&a?.lon&&b?.lat&&b?.lon){const R=6371,la1=+a.lat*Math.PI/180,la2=+b.lat*Math.PI/180,dl=(+b.lat-+a.lat)*Math.PI/180,dn=(+b.lon-+a.lon)*Math.PI/180;const q=Math.sin(dl/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))}return 9999}
function smartOrder(spots,focus){let a=[...spots];if(focus==='priority')return a.sort((x,y)=>(y.priority||0)-(x.priority||0));if(focus==='category'){return a.sort((x,y)=>String(x.category).localeCompare(String(y.category))||((y.priority||0)-(x.priority||0)))}if(focus==='near'){let out=[];while(a.length){let cur=out[out.length-1];if(!cur){cur=a.sort((x,y)=>(y.priority||0)-(x.priority||0))[0];out.push(cur);a=a.filter(x=>x.id!==cur.id);continue}let next=a.reduce((best,x)=>spotDistance(cur,x)<spotDistance(cur,best)?x:best,a[0]);out.push(next);a=a.filter(x=>x.id!==next.id)}return out}return a}

function runConcierge(){const t=trip();if(!t)return;const fav=data.spots.filter(s=>s.favorite);if(!fav.length){closeModal();switchPage('explore');toast('まず行きたい場所をお気に入り登録してください');return}const pace=selectedChoice('paceChoices'),focus=selectedChoice('focusChoices'),transport=document.getElementById('conciergeTransport')?.value||'未設定',interests=selectedMultiChoices('interestChoices'),meal=document.getElementById('conciergeMeal')?.value||'自由に選ぶ',note=document.getElementById('conciergeNote')?.value.trim()||'';const perDay=pace==='relaxed'?2:pace==='active'?5:3;const dates=tripDates(t),ordered=smartOrder(fav,focus);t.plans=t.plans||[];let added=0;ordered.forEach((s,i)=>{if(t.plans.some(p=>p.spotId===s.id))return;const day=Math.min(Math.floor(added/perDay),dates.length-1),date=dates[day];const within=t.plans.filter(p=>p.date===date).length;const times=pace==='relaxed'?['10:00','15:00']:pace==='active'?['08:30','10:30','13:00','15:30','18:00']:['09:30','13:00','16:00'];const time=times[Math.min(within,times.length-1)]||'10:00';t.plans.push({id:eid('plan'),spotId:s.id,title:s.name,date,time,cost:0,memo:[s.oneLine||'行きたい場所から自動作成',interests.length?'重視：'+interests.join('・'):'',meal!=='自由に選ぶ'?'食事：'+meal:'',note?'希望：'+note:''].filter(Boolean).join(' ／ '),done:false,order:within,transport,expenseCategory:'その他'});added++});save(); if(added){ showConciergeResult(t,added,{transport,paceLabel:pace==='relaxed'?'ゆったり':pace==='active'?'たくさん回る':'標準',interests,note}); } else { closeModal(); switchPage('plan'); toast('新しく追加できる場所はありません'); }}

function generatePlan(){const t=trip();if(!t){openTripModal();toast('まず旅行を作成してください');return}const f=data.spots.filter(x=>x.favorite).slice(0,8);if(!f.length){switchPage('explore');toast('まず行きたい場所を登録してください');return}t.plans=t.plans||[];const dates=[];if(t.startDate&&t.endDate){let d=new Date(t.startDate+'T00:00:00'),end=new Date(t.endDate+'T00:00:00');while(d<=end&&dates.length<14){dates.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}}if(!dates.length)dates.push(t.startDate||today());const times=['09:00','11:30','14:00'];f.forEach((s,i)=>{if(!t.plans.some(p=>p.spotId===s.id)){const day=dates[Math.min(Math.floor(i/3),dates.length-1)];t.plans.push({id:eid('plan'),spotId:s.id,title:s.name,date:day,time:times[i%3],cost:0,memo:s.oneLine||'行きたい場所から作成',done:false,order:t.plans.filter(p=>(p.date||'')===day).length})}});save();switchPage('plan');toast('行きたい場所からプランを作成しました')}


function parsePrice(v){
  if(v===undefined||v===null)return 0;
  const m=String(v).replace(/,/g,'').match(/\d+(?:\.\d+)?/g);
  if(!m)return 0;
  return Math.max(...m.map(Number));
}
function estimatePlan(spots,pace,t){
  const perDay=pace==='relaxed'?2:pace==='active'?5:3;
  const dates=tripDates(t); const days=Math.max(1,dates.length);
  const entry=spots.reduce((n,s)=>n+parsePrice(s.price),0);
  const mealPerDay=pace==='relaxed'?3500:pace==='active'?4500:4000;
  const transportPerDay=pace==='active'?1800:pace==='relaxed'?1200:1500;
  const meals=mealPerDay*days,transport=transportPerDay*days;
  return {entry,meals,transport,total:entry+meals+transport,days,perDay};
}
function planWarnings(items,t,pace){
  const warnings=[];
  const dates=[...new Set(items.map(x=>x.date))];
  dates.forEach(d=>{const n=items.filter(x=>x.date===d).length;if(n>(pace==='relaxed'?2:pace==='active'?5:3))warnings.push(`${d}：予定が多めです`)});
  if(items.some(x=>!x.spot.lat||!x.spot.lon))warnings.push('位置情報がない場所があります（移動距離は計算できません）');
  if(items.some(x=>!x.spot.hours))warnings.push('営業時間が未登録の場所があります');
  return warnings;
}
function buildPreview(spots,pace,focus,t){
  const perDay=pace==='relaxed'?2:pace==='active'?5:3;
  const ordered=smartOrder(spots,focus);
  const dates=tripDates(t);
  const times=pace==='relaxed'?['10:00','15:00']:pace==='active'?['08:30','10:30','13:00','15:30','18:00']:['09:30','13:00','16:00'];
  const out=[];
  ordered.forEach((s,i)=>{const day=Math.min(Math.floor(i/perDay),Math.max(0,dates.length-1));const within=out.filter(x=>x.date===dates[day]).length;out.push({spot:s,date:dates[day]||today(),time:times[Math.min(within,times.length-1)]||'10:00'})});
  const est=estimatePlan(ordered,pace,t);
  const warnings=planWarnings(out,t,pace);
  return {items:out,score:ordered.reduce((n,s)=>n+(+s.priority||0),0),estimate:est,warnings};
}
function rainyCandidates(spots){
  const indoorWords=/美術館|博物館|水族館|科学館|屋内|ショッピング|モール|カフェ|喫茶|劇場|映画|温泉|スパ|ホテル|展望|神社|寺|museum|aquarium|cafe|mall/i;
  const indoor=spots.filter(s=>indoorWords.test(`${s.name||''} ${s.category||''} ${s.description||''} ${s.oneLine||''}`));
  const rest=spots.filter(s=>!indoor.includes(s));
  return [...indoor,...rest];
}

function haversineKm(a,b){
 const lat1=+a?.lat,lon1=+a?.lon,lat2=+b?.lat,lon2=+b?.lon;
 if(![lat1,lon1,lat2,lon2].every(Number.isFinite))return null;
 const R=6371,rad=Math.PI/180,dLat=(lat2-lat1)*rad,dLon=(lon2-lon1)*rad;
 const q=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}
function movementEstimateMinutes(km,mode){
 if(km==null)return null;
 const m=String(mode||'').toLowerCase();
 if(/徒歩|walk/.test(m))return Math.max(4,Math.round(km/4.5*60));
 if(/自転車|bike/.test(m))return Math.max(3,Math.round(km/15*60));
 if(/公共交通|電車|バス|train|bus/.test(m))return Math.max(5,Math.round(km/25*60)+10);
 if(/車|自動車|driv/.test(m))return Math.max(3,Math.round(km/35*60)+5);
 return Math.max(5,Math.round(km/25*60)+8);
}
function dayLoadInfo(t,date){
 const items=dayPlans(t,date),spots=items.map(p=>data.spots.find(s=>s.id===p.spotId)).filter(Boolean);
 let km=0,known=0;
 for(let i=1;i<spots.length;i++){const d=haversineKm(spots[i-1],spots[i]);if(d!=null){km+=d;known++;}}
 const mins=movementEstimateMinutes(km,t.transport);
 const outdoor=spots.filter(s=>/公園|海|山|展望|動物園|庭園|アウトドア|park|beach|mountain/i.test(`${s.category||''} ${s.name||''} ${s.description||''}`)).length;
 return {items,spots,km,known,mins,outdoor};
}

 const dist=d.known?`約${d.km.toFixed(1)}km`:'計算できる場所が不足';
 const time=d.mins!=null?`約${d.mins}分`:'計算できません';
 openModal(`<div class="modal-head"><h2>🧭 ${esc(date)}の移動・負荷</h2><button class="close" onclick="closeModal()">×</button></div>

 const statusOf=p=>{if(p.done)return 'done';if(p.date!==todayStr)return 'upcoming';const m=(String(p.time||'').match(/^(\d{1,2}):(\d{2})$/));if(!m)return 'next';const pm=+m[1]*60+(+m[2]);return pm<hm?'past':'next'};
 const current=todayPlans.find(p=>statusOf(p)==='next')||todayPlans.find(p=>!p.done);

 const spent=(t.expenses||[]).reduce((n,x)=>n+(+x.amount||0),0);

 openModal(`<div class="modal-head"><h2>📱 旅行中ダッシュボード</h2><button class="close" onclick="closeModal()">×</button></div>
 <div class="concierge-box"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(t.name)}</b><span class="tag">${todayStr}</span></div><p class="small" style="margin-bottom:0">${todayPlans.length?'今日の予定をリアルタイム感覚で確認できます。':'今日は予定がないため、未完了の予定を表示しています。'}</p></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>📊 今日の進み具合</b><strong>${pct}%</strong></div><p class="small">${done} / ${total} 件完了</p><div class="progress"><i style="width:${pct}%"></i></div><p class="small" style="margin:8px 0 0">今日の予定費用：約${todayCost.toLocaleString()}円${budget?` ／ 実支出 ${spent.toLocaleString()}円`:''}</p>${doneList}</div>
 ${next?`<div class="card" style="border:2px solid rgba(8,120,109,.16)"><span class="tag">${current?'次の予定':'次におすすめ'}</span><h2 style="margin:8px 0 4px;font-size:20px">${esc(next.time||'--:--')}　${esc(next.title)}</h2>${spot?`<p class="small">📍 ${esc(spot.address||spot.prefecture||'場所情報あり')}</p>`:''}${next.memo?`<p class="small">📝 ${esc(next.memo)}</p>`:''}${nextButtons}</div>`:`<div class="empty"><div>🎉</div><p>今日の予定はすべて完了しました。</p><button class="btn" onclick="closeModal();openNoteModal()">今日の思い出を残す</button></div>`}

 <div class="hint">この画面は旅行中の操作をまとめたものです。地図・営業時間・天気などの最新情報は公式情報でも確認してください。</div>`)
}

function completeFromTravel(id){const t=trip();if(!t)return;const p=(t.plans||[]).find(x=>x.id===id);if(!p)return;p.done=true;save();openTravelMode();toast('予定を完了しました');}

function renderRecommendSelect(){const e=document.getElementById('recommendPref');if(!e)return;const cur=e.value;e.innerHTML='<option value="">行き先（都道府県）を選択</option>'+PREF.map(p=>`<option value="${p}">${p}</option>`).join('');if(PREF.includes(cur))e.value=cur}function runQualityCheck(){
 const t=trip();
 const checks=[];
 const dates=tripDates(t);
 checks.push({title:'旅行先',ok:!!(t&&t.destination),detail:t&&t.destination?t.destination:'行き先が未設定です',action:t?'旅行設定を確認':'旅行を作成'});
 checks.push({title:'日程',ok:!!(t&&t.start&&t.end),detail:t&&t.start&&t.end?`${t.start} 〜 ${t.end}`:'旅行日程が未設定です',action:t?'旅行設定を確認':'旅行を作成'});
 const plans=t?.plans||[];
 checks.push({title:'旅程',ok:plans.length>0,detail:plans.length?`${plans.length}件の予定があります`:'予定がまだありません',action:'旅程を開く'});
 const missing=data.spots.filter(s=>t&&s.tripId===t.id&&!s.address&&!s.lat&&!s.lon);
 checks.push({title:'スポット情報',ok:missing.length===0,detail:missing.length?`${missing.length}件のスポットに場所情報がありません`:'場所情報がそろっています',action:'スポットを確認'});
 const costMissing=plans.filter(p=>p.spotId&&!Number.isFinite(Number(p.cost)));
 checks.push({title:'費用',ok:costMissing.length===0,detail:costMissing.length?`${costMissing.length}件の予定で費用が未入力です`:'予定の費用情報を確認できます',action:'旅程を開く'});
 const byDay={};plans.forEach(p=>{const d=p.date||'';byDay[d]=(byDay[d]||0)+1});
 const crowded=Object.entries(byDay).filter(([d,n])=>n>6);
 checks.push({title:'1日の予定量',ok:crowded.length===0,detail:crowded.length?crowded.map(([d,n])=>`${d||'日付未設定'}：${n}件`).join(' / '):'1日に予定が集中していません',action:'旅程を開く'});
 const incomplete=plans.filter(p=>!p.done).length;
 checks.push({title:'完了状況',ok:plans.length===0||incomplete===0,detail:plans.length?`${incomplete}件が未完了です`:'旅行開始前なら問題ありません',action:'旅行中モード'});
 return checks;
}
function openQualityCheck(){

 const ok=checks.filter(x=>x.ok).length;
 openModal(`<div class="modal-head"><h2>🧪 旅行計画チェック</h2><button class="close" onclick="closeModal()">×</button></div><div class="card"><b>現在の旅行を自動チェック</b><p class="small">入力漏れや予定の偏りを確認します。判定は目安です。</p><div class="health-grid">${checks.map((c,i)=>`<div class="health-item ${c.ok?'ok':'warn'}"><div><span class="health-mark">${c.ok?'✓':'△'}</span><b>${esc(c.title)}</b></div><div class="small">${esc(c.detail)}</div>${!c.ok?`<div class="health-action"><button class="btn secondary full tap-lg" onclick="qualityAction(${i})">${esc(c.action)}</button></div>`:''}</div>`).join('')}</div><p class="small" style="margin-top:12px">${ok}/${checks.length}項目を確認できています。</p></div><button class="btn full" onclick="closeModal()">閉じる</button>`);
 window._qualityChecks=checks;
}
function qualityAction(i){const c=(window._qualityChecks||[])[i];if(!c){return}closeModal();if(c.action==='旅程を開く')switchPage('plan');else if(c.action==='旅行中モード')openTripDashboard();else if(c.action==='スポットを確認')switchPage('explore');else if(c.action==='旅行設定を確認')openTripEditor(trip().id);else openTripWizard();}

function generateTravelJournal(){
  const t=trip();
  if(!t){toast('旅行を選択してください');return;}
  const dates=tripDates(t);
  const plans=(t.plans||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const visited=(data.spots||[]).filter(s=>s.visited && (!t.spotIds || t.spotIds.includes(s.id)));
  const spent=(t.expenses||[]).reduce((n,e)=>n+(Number(e.amount)||0),0);
  let html='<div class="card"><h3>📖 '+esc(t.name||'旅行')+'の旅行記</h3>';
  html+='<p class="muted">'+esc(t.start||'')+' ～ '+esc(t.end||'')+'</p>';
  html+='<div class="journal-summary"><b>訪れた場所：</b>'+visited.length+'件　 <b>記録した支出：</b>¥'+spent.toLocaleString()+'</div>';
  dates.forEach((d,i)=>{
    const day=plans.filter(x=>x.date===d);
    html+='<div class="journal-day"><h4>Day '+(i+1)+'　'+esc(d)+'</h4>';
    if(!day.length) html+='<p class="muted">この日の予定はありません。</p>';
    day.forEach(x=>{html+='<div class="journal-item"><b>'+esc(x.time||'')+' '+esc(x.title||x.name||'予定')+'</b>'+(x.memo?'<div>'+esc(x.memo)+'</div>':'')+'</div>';});
    html+='</div>';
  });
  html+='<div class="journal-actions"><button class="btn primary" onclick="copyTravelJournal()">📋 文章をコピー</button></div></div>';
  openModal('📖 旅行記を作る',html);
  window.__travelJournalText=buildTravelJournalText(t,dates,plans,visited,spent);
}
function buildTravelJournalText(t,dates,plans,visited,spent){
  let out='【'+(t.name||'旅行')+'】\n'+(t.start||'')+' ～ '+(t.end||'')+'\n\n';
  dates.forEach((d,i)=>{
    out+='Day '+(i+1)+' '+d+'\n';
    const day=plans.filter(x=>x.date===d);
    day.forEach(x=>out+='・'+(x.time||'')+' '+(x.title||x.name||'予定')+(x.memo?'｜'+x.memo:'')+'\n');
    out+='\n';
  });
  out+='訪れた場所：'+visited.length+'件\n記録した支出：¥'+spent.toLocaleString()+'\n';
  return out;
}

    try{localStorage.setItem('__tn_test','1'); localStorage.removeItem('__tn_test')}catch(e){issues.push('端末の保存領域を利用できません。')}

    const photoCount=data.spots.filter(x=>x.image).length+data.notes.filter(x=>x.image).length;
    if(photoCount>20) warnings.push('写真が多いため、保存容量に注意してください。');
    let jsonOK=true; try{JSON.stringify(data)}catch(e){jsonOK=false}
    if(!jsonOK) issues.push('データをバックアップ可能な形式に変換できません。');
    const checks=[
      ['保存領域',issues.some(x=>x.includes('保存領域'))?'要確認':'OK'],
      ['旅行データ',Array.isArray(data.trips)?'OK':'要確認'],
      ['スポットデータ',Array.isArray(data.spots)?'OK':'要確認'],
      ['旅ノート',Array.isArray(data.notes)?'OK':'要確認'],
      ['JSONバックアップ',jsonOK?'OK':'要確認']

    openModal(html);
  };
  const oldSettings=window.openSettings;
  window.openSettings=function(){
    oldSettings();
    setTimeout(()=>{
      const body=document.querySelector('.modal-body')||document.querySelector('.modal-content');
      if(!body||body.querySelector('#v52-final'))return;
      const box=document.createElement('div'); box.id='v52-final'; box.innerHTML='<div class="cloud-sync-card"><div class="cloud-sync-status"><span class="cloud-dot ready"></span>V52 最終仕上げ</div><div class="sync-note">保存・データ構造・バックアップの基本状態を確認できます。</div><button class="btn secondary" style="margin-top:10px;width:100%" onclick="runFinalHealthCheck()">🧪 最終データチェック</button></div>';
      body.appendChild(box);
    },40);
  };
})();

  // Make the home quick actions clearly different rather than funneling to the same input.

  const V55_KEY='travel_note_reco_offset_v55';
  const V55_GENRE_KEY='travel_note_reco_genre_v55';

  function v55Offsets(){
    try{return JSON.parse(localStorage.getItem(V55_KEY)||'{}')}catch(e){return {}}
  }
  function v55SaveOffsets(o){try{localStorage.setItem(V55_KEY,JSON.stringify(o))}catch(e){}}
  function v55Genre(){return localStorage.getItem(V55_GENRE_KEY)||'観光'}
  function v55SetGenre(g){try{localStorage.setItem(V55_GENRE_KEY,g)}catch(e){}}

  function v55MapUrl(pref, genre){
    const q = `${pref} ${genre==='観光'?'観光スポット':genre}`;
    return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
  }
  function v55WebUrl(pref, genre){
    return 'https://www.google.com/search?q='+encodeURIComponent(`${pref} ${genre} おすすめ`);
  }

  function v55List(pref){
    return RECOMMEND_V55[pref] || [];
  }

  function v55Visible(pref, advance){
    const all=v55List(pref);
    if(!all.length)return [];
    const offsets=v55Offsets();
    let offset=Number(offsets[pref]||0);
    if(advance) offset=(offset+1)%all.length;
    offsets[pref]=offset;
    v55SaveOffsets(offsets);
    const out=[];
    for(let i=0;i<Math.min(4,all.length);i++) out.push(all[(offset+i)%all.length]);
    return out;
  }

  function v55CurrentTrip(){try{return typeof trip==='function'?trip():null}catch(e){return null}}

  function v55Esc(s){
    return typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function v55Render(pref, genre='観光', advance=false, title='行き先から候補を探す'){
    if(!pref){
      if(typeof toast==='function')toast('行き先の都道府県を選択してください');
      return;
    }
    v55SetGenre(genre);
    const t=v55CurrentTrip();
    const list=v55Visible(pref,advance);
    const registeredNames=new Set((data.spots||[]).map(s=>s.name));
    const dates=t && t.startDate && t.endDate ? (()=>{const a=[];let d=new Date(t.startDate),e=new Date(t.endDate);for(;d<=e;d.setDate(d.getDate()+1))a.push(d.toISOString().slice(0,10));return a})():[];
    const selectedDate=dates[0]||new Date().toISOString().slice(0,10);
    const genreButtons=['観光','グルメ','カフェ','ホテル'].map(g=>`<button type="button" class="v55-genre ${genre===g?'on':''}" onclick="v55ChooseGenre(${JSON.stringify(pref)},${JSON.stringify(g)})">${g==='観光'?'📍':g==='グルメ'?'🍴':g==='カフェ'?'☕':'🏨'} ${g}</button>`).join('');
    const builtIn = genre==='観光'
      ? (list.length ? `<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div><b>🗾 ${v55Esc(pref)}のおすすめ観光スポット</b><p class="small" style="margin:4px 0 0">更新するたびに表示する候補を少しずつ入れ替えます。</p></div><button type="button" class="btn secondary" onclick="v55Refresh(${JSON.stringify(pref)},${JSON.stringify(genre)})">🔄 更新</button></div>${list.map((r)=>{
          const exists=registeredNames.has(r[0]);
          return `<div class="v55-reco"><div class="v55-reco-icon">${r[2]}</div><div class="v55-reco-main"><b>${v55Esc(r[0])}</b><span class="small">${v55Esc(r[1])}</span><div class="v55-reco-actions">${exists?`<span class="tag">登録済み</span>`:`<button class="mini-btn" type="button" onclick="v55AddRecommended(${JSON.stringify(pref)},${JSON.stringify(r[0])})">＋ 行きたいに追加</button>`}${t?`<button class="mini-btn" type="button" onclick="v55AddToPlan(${JSON.stringify(pref)},${JSON.stringify(r[0])})">🗓 この旅行に追加</button>`:''}</div></div></div>`;
        }).join('')}</div>`:'<div class="card"><b>候補がありません</b><p class="small">Google MapsまたはWeb検索から探せます。</p></div>')
      : `<div class="card"><b>🌐 ${v55Esc(pref)}の${v55Esc(genre)}を探す</b><p class="small">最新の店舗・施設情報は外部検索で探せます。</p><div class="grid"><a class="btn secondary full" target="_blank" rel="noopener" href="${v55MapUrl(pref,genre)}">🗺️ Google Mapsで探す</a><a class="btn secondary full" target="_blank" rel="noopener" href="${v55WebUrl(pref,genre)}">🌐 Webで探す</a></div></div>`;

    const planBox=t?`<div class="card"><b>🗓️ 旅程へ追加する日</b><div class="row" style="margin-top:8px"><select id="v55Date" class="field">${dates.map(d=>`<option value="${d}">${d}</option>`).join('')||`<option value="${selectedDate}">${selectedDate}</option>`}</select><input id="v55Time" type="time" class="field" value="15:00"></div><p class="small" style="margin-top:7px">「この旅行に追加」を押すと、選んだ日時に予定として追加します。</p></div>`:'';

    openModal(`<div class="modal-head"><h2>🗾 ${v55Esc(title)}</h2><button class="close" onclick="closeModal()">×</button></div>
      <p class="small">行き先の都道府県を1つ選ぶだけで、その地域の候補をまとめて探せます。</p>
      <div class="group"><label>行き先（都道府県）</label><select id="v55Pref" class="field" onchange="v55PrefChanged()">${PREF.map(p=>`<option value="${v55Esc(p)}" ${p===pref?'selected':''}>${v55Esc(p)}</option>`).join('')}</select></div>
      <div class="group"><label>探したいジャンル</label><div class="v55-genres">${genreButtons}</div></div>
      ${builtIn}
      ${planBox}

<script>
/* =========================
   V56 出発・帰宅計画
   - 出発地点をユーザーが入力
   - 最初/最後の旅程スポットを自動候補
   - 所要時間から出発・帰宅時刻を逆算
   - Google Mapsで往復ルート確認
   - 旅行ごとに設定を保存
========================= */
(function(){
  const KEY='travel_note_departure_plan_v56_';
  const esc56=s=>typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const pad=n=>String(n).padStart(2,'0');
  function getTrip(){try{return typeof trip==='function'?trip():null}catch(e){return null}}
  function plans(t){return (t?.plans||[]).filter(p=>p.date||p.time).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||''))||(a.order??0)-(b.order??0))}
  function spotName(p){const sp=p?.spotId?data.spots.find(s=>s.id===p.spotId):null;return sp?.name||p?.title||''}
  function load(t){if(!t)return{};try{return JSON.parse(localStorage.getItem(KEY+t.id)||'{}')}catch(e){return{}}}
  function saveCfg(t,c){if(!t)return;try{localStorage.setItem(KEY+t.id,JSON.stringify(c))}catch(e){}}
  function parseDuration(v){
    const s=String(v||'').trim();
    if(!s)return 0;
    const h=(s.match(/(\d+(?:\.\d+)?)\s*(?:時間|h|hr|hours?)/i)||[])[1];
    const m=(s.match(/(\d+)\s*(?:分|min|minutes?)/i)||[])[1];
    if(h||m)return Math.round((Number(h||0)*60)+(Number(m||0)));
    const hm=s.match(/^(\d{1,2}):([0-5]\d)$/);if(hm)return Number(hm[1])*60+Number(hm[2]);
    const n=Number(s);return Number.isFinite(n)?Math.round(n):0;
  }
  function fmtDuration(min){if(!min)return '—';const h=Math.floor(min/60),m=min%60;return h?`${h}時間${m?m+'分':''}`:`${m}分`}
  function toMin(hm){const m=String(hm||'').match(/^(\d{1,2}):([0-5]\d)$/);return m?Number(m[1])*60+Number(m[2]):null}
  function fromMin(n){n=((n%1440)+1440)%1440;return pad(Math.floor(n/60))+':'+pad(n%60)}
  function mapUrl(origin,dest){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(dest)+'&travelmode=driving'}
  function selectedDestinations(t,cfg){
    const ps=plans(t);if(!ps.length)return {first:null,last:null};
    const firstId=cfg?.firstPlanId&&ps.some(p=>p.id===cfg.firstPlanId)?cfg.firstPlanId:ps[0].id;
    const lastId=cfg?.lastPlanId&&ps.some(p=>p.id===cfg.lastPlanId)?cfg.lastPlanId:ps[ps.length-1].id;
    return {first:ps.find(p=>p.id===firstId)||ps[0],last:ps.find(p=>p.id===lastId)||ps[ps.length-1]};
  }
  function options(ps,sel){return ps.map(p=>`<option value="${esc56(p.id)}" ${p.id===sel?'selected':''}>${esc56(p.date||'日付未定')} ${esc56(p.time||'--:--')}　${esc56(spotName(p))}</option>`).join('')}
  function calcOutbound(cfg){const arr=toMin(cfg.arrivalTime)||toMin(cfg.firstTime)||null;const dur=parseDuration(cfg.outboundDuration);const buf=Number(cfg.buffer||0);return arr===null||!dur?null:arr-dur-buf}
  function calcReturn(cfg){const leave=toMin(cfg.returnLeaveTime)||null;const dur=parseDuration(cfg.returnDuration);return leave!==null&&dur?leave+dur:null}

  window.openDeparturePlanV56=function(){
    const t=getTrip();
    if(!t){if(typeof openTripModal==='function')openTripModal();if(typeof toast==='function')toast('先に旅行を作成してください');return}
    const cfg=load(t);const ps=plans(t);const d=selectedDestinations(t,cfg);
    if(!ps.length){
      openModal(`<div class="modal-head"><h2>🚗 出発・帰宅計画</h2><button class="close" onclick="closeModal()">×</button></div><div class="empty"><div>🗓️</div><p>まず旅行の日程に最初の予定を追加してください。</p><button class="btn full" onclick="closeModal();switchPage('plan')">旅程を作る</button></div>`);return;
    }
    cfg.origin=cfg.origin||'';cfg.outboundDuration=cfg.outboundDuration||'60';cfg.returnDuration=cfg.returnDuration||'60';cfg.buffer=cfg.buffer??15;
    cfg.arrivalTime=cfg.arrivalTime||d.first?.time||'10:00';cfg.returnLeaveTime=cfg.returnLeaveTime||d.last?.time||'17:00';
    const out=calcOutbound(cfg),ret=calcReturn(cfg);
    const outText=out===null?'到着時刻と所要時間を入力すると自動計算':`おすすめ出発時刻：<strong>${fromMin(out)}</strong>`;
    const retText=ret===null?'帰りの出発時刻と所要時間を入力すると計算':`自宅到着予定：<strong>${fromMin(ret)}</strong>`;
    const origin=cfg.origin||'出発地点を入力';
    const firstName=spotName(d.first)||'最初の目的地';const lastName=spotName(d.last)||'最後の目的地';
    const outLink=cfg.origin?mapUrl(cfg.origin,firstName):'#';
    const retLink=cfg.origin?mapUrl(lastName,cfg.origin):'#';
    openModal(`<div class="modal-head"><h2>🚗 出発・帰宅計画</h2><button class="close" onclick="closeModal()">×</button></div>
      <p class="small">出発する場所を入力すると、最初の目的地までの移動時間をもとに「何時に出ればよいか」を計算できます。帰りも同じように計画できます。</p>
      <div class="v56-route-card"><h3>📍 まずは出発する場所</h3><input id="v56Origin" class="field" value="${esc56(cfg.origin)}" placeholder="例：愛知県刈谷市、名古屋駅、自宅など"><p class="v56-note" style="margin:8px 0 0">自宅・最寄り駅・ホテルなど、実際に出発する場所を入力してください。</p></div>
      <div id="v57CarTools"><div class="v56-route-card"><h3>🛣️ 行き：出発 → 最初の目的地</h3>
        <div class="group"><label>最初の目的地</label><select id="v56First" class="field">${options(ps,d.first?.id)}</select></div>
        <div class="v56-route-grid"><div><label>到着したい時刻</label><input id="v56Arrival" class="field" type="time" value="${esc56(cfg.arrivalTime)}"></div><div><label>車での所要時間（分）</label><input id="v56OutDur" class="field" type="number" min="1" step="5" value="${parseDuration(cfg.outboundDuration)||60}"></div></div>
        <div class="v56-route-grid"><div><label>余裕時間（分）</label><select id="v56Buffer" class="field"><option value="0" ${Number(cfg.buffer)===0?'selected':''}>0分</option><option value="15" ${Number(cfg.buffer)===15?'selected':''}>15分</option><option value="30" ${Number(cfg.buffer)===30?'selected':''}>30分</option><option value="45" ${Number(cfg.buffer)===45?'selected':''}>45分</option><option value="60" ${Number(cfg.buffer)===60?'selected':''}>60分</option></select></div><div class="v56-calc">${outText}</div></div>
        <div class="grid" style="margin-top:10px"><button class="btn full" onclick="v56SaveAndCalc()">🔄 出発時刻を計算</button><a id="v56OutMap" class="btn secondary full" target="_blank" rel="noopener" href="${outLink}">🗺️ Google Mapsで確認</a></div>
      </div>
      <div class="v56-route-card"><h3>🏠 帰り：最後の目的地 → 出発地点</h3>
        <div class="group"><label>最後の目的地</label><select id="v56Last" class="field">${options(ps,d.last?.id)}</select></div>
        <div class="v56-route-grid"><div><label>最後の目的地を出る時刻</label><input id="v56ReturnLeave" class="field" type="time" value="${esc56(cfg.returnLeaveTime)}"></div><div><label>車での所要時間（分）</label><input id="v56RetDur" class="field" type="number" min="1" step="5" value="${parseDuration(cfg.returnDuration)||60}"></div></div>
        <div class="v56-calc">${retText}</div>
        <div class="grid" style="margin-top:10px"><button class="btn full" onclick="v56SaveAndCalc()">🔄 帰宅時刻を計算</button><a id="v56RetMap" class="btn secondary full" target="_blank" rel="noopener" href="${retLink}">🗺️ Google Mapsで確認</a></div>
      </div>
      <div class="card"><b>💡 使い方</b><p class="v56-note">Google Mapsで実際の所要時間を確認して、その時間を入力してください。渋滞・休憩・駐車時間なども考えて「余裕時間」を追加すると、より安心な出発時刻になります。</p></div>
      <button class="btn secondary full" onclick="v56SaveAndCalc(true)">💾 出発・帰宅設定を保存</button>`);
    renderTransportUI(c);
  };

  window.v56SaveAndCalc=function(closeAfter){
    const t=getTrip();if(!t)return;
    const ps=plans(t);const cfg=load(t);
    cfg.origin=(document.getElementById('v56Origin')?.value||'').trim();
    cfg.firstPlanId=document.getElementById('v56First')?.value||ps[0]?.id;
    cfg.lastPlanId=document.getElementById('v56Last')?.value||ps[ps.length-1]?.id;
    cfg.arrivalTime=document.getElementById('v56Arrival')?.value||'10:00';
    cfg.outboundDuration=document.getElementById('v56OutDur')?.value||'60';
    cfg.buffer=document.getElementById('v56Buffer')?.value||'0';
    cfg.returnLeaveTime=document.getElementById('v56ReturnLeave')?.value||'17:00';
    cfg.returnDuration=document.getElementById('v56RetDur')?.value||'60';
    saveCfg(t,cfg);
    const d=selectedDestinations(t,cfg);const firstName=spotName(d.first);const lastName=spotName(d.last);
    const out=calcOutbound(cfg),ret=calcReturn(cfg);
    const oc=document.querySelector('.v56-route-card:nth-of-type(2) .v56-calc');
    const rc=document.querySelector('.v56-route-card:nth-of-type(3) .v56-calc');
    if(oc)oc.innerHTML=out===null?'到着時刻と所要時間を入力すると自動計算':`おすすめ出発時刻：<strong>${fromMin(out)}</strong>`;
    if(rc)rc.innerHTML=ret===null?'帰りの出発時刻と所要時間を入力すると計算':`自宅到着予定：<strong>${fromMin(ret)}</strong>`;
    const om=document.getElementById('v56OutMap');if(om){om.href=cfg.origin&&firstName?mapUrl(cfg.origin,firstName):'#';om.style.opacity=cfg.origin?'1':'.5'}
    const rm=document.getElementById('v56RetMap');if(rm){rm.href=cfg.origin&&lastName?mapUrl(lastName,cfg.origin):'#';rm.style.opacity=cfg.origin?'1':'.5'}
    if(typeof toast==='function')toast(closeAfter?'出発・帰宅設定を保存しました':'出発・帰宅時刻を更新しました');
    if(closeAfter)closeModal();
  };

  // Add a travel-hub shortcut as well.
  const oldHub=window.openTravelHub;
  if(typeof oldHub==='function'){
    window.openTravelHub=function(){oldHub();setTimeout(()=>{
      const modal=document.getElementById('modal');if(!modal||modal.querySelector('#v56-hub-btn'))return;
      const b=document.createElement('button');b.id='v56-hub-btn';b.className='btn full';b.style.marginTop='8px';b.textContent='🚗 出発・帰宅を計画';b.onclick=()=>{closeModal();openDeparturePlanV56()};modal.appendChild(b);
    },20)};
  }
})();
</script>

<script>
/* =========================
   V57 自動ルート所要時間
   - 出発地点を住所入力 / 現在地取得
   - Nominatimで地点を座標化
   - OSRMで車の推定距離・所要時間を自動取得
   - 行き/帰りを自動計算
   - V56の保存データと互換
   ※公開ルートAPIのため、交通渋滞を含むリアルタイム時間ではありません。
========================= */
(function(){
  const KEY='travel_note_departure_plan_v56_';
  const esc57=s=>typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const pad=n=>String(n).padStart(2,'0');
  const getTrip=()=>{try{return typeof trip==='function'?trip():null}catch(e){return null}};
  const plans=t=>(t?.plans||[]).filter(p=>p.date||p.time).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||''))||(a.order??0)-(b.order??0));
  const spotFor=p=>p?.spotId?data.spots.find(s=>s.id===p.spotId):null;
  const spotName=p=>spotFor(p)?.name||p?.title||'';
  const load=t=>{try{return JSON.parse(localStorage.getItem(KEY+t.id)||'{}')}catch(e){return{}}};
  const saveCfg=(t,c)=>{try{localStorage.setItem(KEY+t.id,JSON.stringify(c))}catch(e){}};
  const parseDur=v=>{const s=String(v||'').trim();if(!s)return 0;const h=(s.match(/(\d+(?:\.\d+)?)\s*(?:時間|h|hr|hours?)/i)||[])[1];const m=(s.match(/(\d+)\s*(?:分|min|minutes?)/i)||[])[1];if(h||m)return Math.round(Number(h||0)*60+Number(m||0));const hm=s.match(/^(\d{1,2}):([0-5]\d)$/);if(hm)return Number(hm[1])*60+Number(hm[2]);const n=Number(s);return Number.isFinite(n)?Math.round(n):0};
  const fmtDur=min=>{if(!min)return '—';const h=Math.floor(min/60),m=Math.round(min%60);return h?`${h}時間${m?m+'分':''}`:`${m}分`};
  const toMin=hm=>{const m=String(hm||'').match(/^(\d{1,2}):([0-5]\d)$/);return m?Number(m[1])*60+Number(m[2]):null};
  const fromMin=n=>{n=((n%1440)+1440)%1440;return pad(Math.floor(n/60))+':'+pad(n%60)};
  const mapUrl=(o,d)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(o)+'&destination='+encodeURIComponent(d)+'&travelmode=driving';
  const selected=(t,c)=>{const ps=plans(t);if(!ps.length)return{first:null,last:null};const fi=c?.firstPlanId&&ps.some(p=>p.id===c.firstPlanId)?c.firstPlanId:ps[0].id;const li=c?.lastPlanId&&ps.some(p=>p.id===c.lastPlanId)?c.lastPlanId:ps[ps.length-1].id;return{first:ps.find(p=>p.id===fi)||ps[0],last:ps.find(p=>p.id===li)||ps[ps.length-1]}};
  const options=(ps,sel)=>ps.map(p=>`<option value="${esc57(p.id)}" ${p.id===sel?'selected':''}>${esc57(p.date||'日付未定')} ${esc57(p.time||'--:--')}　${esc57(spotName(p))}</option>`).join('');
  const geocodeCache={};
  async function geocode(q){
    const key=String(q||'').trim(); if(!key)throw new Error('場所が入力されていません');
    if(geocodeCache[key])return geocodeCache[key];
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&q='+encodeURIComponent(key);
    const r=await fetch(url,{headers:{'Accept':'application/json'}}); if(!r.ok)throw new Error('場所の検索に失敗しました');
    const a=await r.json(); if(!a.length)throw new Error(`「${key}」の場所が見つかりませんでした`);
    const v={lat:Number(a[0].lat),lon:Number(a[0].lon),label:a[0].display_name||key}; geocodeCache[key]=v; return v;
  }
  async function reverse(lat,lon){
    try{const u='https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon);const r=await fetch(u,{headers:{'Accept':'application/json'}});if(!r.ok)return '';const a=await r.json();return a.display_name||''}catch(e){return ''}
  }
  async function route(a,b){
    const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false&steps=false`;
    const r=await fetch(u);if(!r.ok)throw new Error('ルート検索に失敗しました');const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw new Error('車のルートが見つかりませんでした');
    return {minutes:Math.max(1,Math.round(j.routes[0].duration/60)),km:j.routes[0].distance/1000};
  }
  async function resolveSpot(p){
    const sp=spotFor(p);if(sp&&Number.isFinite(Number(sp.lat))&&Number.isFinite(Number(sp.lon)))return{lat:Number(sp.lat),lon:Number(sp.lon),label:sp.name};
    return geocode((sp?.address||'')||spotName(p));
  }
  function transportMode(c){return c.transportMode||'car'}
  function transportLabel(m){return m==='trainbus'?'🚆 電車・バス':m==='shinkansen'?'🚄 新幹線':'🚗 車'}
  function transitMapUrl(origin,dest){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin||'')+'&destination='+encodeURIComponent(dest||'')+'&travelmode=transit'}
  function openTransitRoute(kind){const t=getTrip();if(!t)return;const c=saveFromUI();const d=selected(t,c);const from=kind==='ret'?spotName(d.last):c.origin;const to=kind==='ret'?c.origin:spotName(d.first);if(!from||!to){if(typeof toast==='function')toast('出発地点と目的地を設定してください');return}window.open(transitMapUrl(from,to),'_blank','noopener');setStatus('v57Status',transportLabel(transportMode(c))+'の乗換案内をGoogle Mapsで開きました。','ok')}
  function applyTransportMode(m){const t=getTrip();if(!t)return;const c=load(t);c.transportMode=m;saveCfg(t,c);renderTransportUI(c)}
  function renderTransportUI(c){const m=transportMode(c);document.querySelectorAll('[data-v57-mode]').forEach(b=>b.classList.toggle('active',b.dataset.v57Mode===m));const car=document.getElementById('v57CarTools'),trans=document.getElementById('v57TransitTools');if(car)car.style.display=m==='car'?'block':'none';if(trans)trans.style.display=m==='car'?'none':'block';const note=document.getElementById('v57ModeNote');if(note)note.innerHTML=m==='car'?'道路ルートから車の推定所要時間・距離を自動取得します。':m==='trainbus'?'電車・バスはGoogle Mapsの公共交通ルートで、乗換・時刻を確認できます。':'新幹線を含む公共交通ルートをGoogle Mapsで確認できます。乗車列車・指定席などは出発前に公式情報も確認してください。'}
  function cfgTimes(c){const arr=toMin(c.arrivalTime)||null, out=parseDur(c.outboundDuration), buf=Number(c.buffer||0), leave=toMin(c.returnLeaveTime)||null, ret=parseDur(c.returnDuration);return{out:arr!==null&&out?arr-out-buf:null,ret:leave!==null&&ret?leave+ret:null}};

  function setStatus(id,msg,kind){const e=document.getElementById(id);if(e){e.textContent=msg;e.className='v57-status '+(kind||'')}}
  function updateMaps(cfg,first,last){const om=document.getElementById('v57OutMap'),rm=document.getElementById('v57RetMap');const fn=spotName(first),ln=spotName(last);if(om){om.href=cfg.origin&&fn?mapUrl(cfg.origin,fn):'#';om.style.opacity=cfg.origin?1:.5}if(rm){rm.href=cfg.origin&&ln?mapUrl(ln,cfg.origin):'#';rm.style.opacity=cfg.origin?1:.5}}
  function renderResults(cfg){const t=cfgTimes(cfg);const o=document.getElementById('v57OutResult'),r=document.getElementById('v57RetResult');if(o)o.innerHTML=t.out===null?'到着時刻と所要時間から自動計算します':`おすすめ出発時刻：<strong>${fromMin(t.out)}</strong>`;if(r)r.innerHTML=t.ret===null?'帰りの出発時刻と所要時間から自動計算します':`自宅到着予定：<strong>${fromMin(t.ret)}</strong>`;}
  function saveFromUI(){const t=getTrip();if(!t)return null;const ps=plans(t),c=load(t);c.origin=(document.getElementById('v57Origin')?.value||'').trim();c.originLat=Number(document.getElementById('v57OriginLat')?.value)||c.originLat||null;c.originLon=Number(document.getElementById('v57OriginLon')?.value)||c.originLon||null;c.firstPlanId=document.getElementById('v57First')?.value||ps[0]?.id;c.lastPlanId=document.getElementById('v57Last')?.value||ps[ps.length-1]?.id;c.arrivalTime=document.getElementById('v57Arrival')?.value||'10:00';c.outboundDuration=document.getElementById('v57OutDur')?.value||'';c.outboundKm=document.getElementById('v57OutKm')?.value||c.outboundKm||'';c.buffer=document.getElementById('v57Buffer')?.value||'15';c.returnLeaveTime=document.getElementById('v57ReturnLeave')?.value||'17:00';c.returnDuration=document.getElementById('v57RetDur')?.value||'';c.returnKm=document.getElementById('v57RetKm')?.value||c.returnKm||'';c.transportMode=document.querySelector('[data-v57-mode].active')?.dataset.v57Mode||c.transportMode||'car';saveCfg(t,c);return c}
  async function autoRoute(kind){
    const t=getTrip();if(!t)return;const c=saveFromUI();const d=selected(t,c);const origin={lat:Number(c.originLat),lon:Number(c.originLon),label:c.origin};
    try{
      if(!Number.isFinite(origin.lat)||!Number.isFinite(origin.lon)){setStatus('v57Status','📍 出発地点を検索しています…','busy');const g=await geocode(c.origin);c.originLat=g.lat;c.originLon=g.lon;c.origin=g.label?.split(',')[0]||c.origin;document.getElementById('v57Origin').value=c.origin;document.getElementById('v57OriginLat').value=g.lat;document.getElementById('v57OriginLon').value=g.lon;}
      const doOut=kind==='out'||kind==='all',doRet=kind==='ret'||kind==='all';
      if(doOut){setStatus('v57Status','🚗 行きのルートを計算しています…','busy');const dest=await resolveSpot(d.first);const rr=await route({lat:c.originLat,lon:c.originLon},dest);c.outboundDuration=rr.minutes;c.outboundKm=rr.km.toFixed(1);document.getElementById('v57OutDur').value=rr.minutes;document.getElementById('v57OutKm').value=rr.km.toFixed(1);}
      if(doRet){setStatus('v57Status','🏠 帰りのルートを計算しています…','busy');const org=await resolveSpot(d.last);const rr=await route(org,{lat:c.originLat,lon:c.originLon});c.returnDuration=rr.minutes;c.returnKm=rr.km.toFixed(1);document.getElementById('v57RetDur').value=rr.minutes;document.getElementById('v57RetKm').value=rr.km.toFixed(1);}
      saveCfg(t,c);renderResults(c);updateMaps(c,d.first,d.last);setStatus('v57Status','✅ 所要時間を自動取得しました。','ok');if(typeof toast==='function')toast('所要時間を自動取得しました');
    }catch(e){setStatus('v57Status','⚠️ '+(e.message||'自動取得できませんでした')+'。場所名を確認するか、Google Mapsで確認してください。','err');if(typeof toast==='function')toast('所要時間の自動取得に失敗しました')}
  }
  window.v57UseCurrentLocation=function(){return new Promise((resolve,reject)=>{if(!navigator.geolocation){setStatus('v57Status','この端末では現在地を取得できません。','err');reject(new Error('geolocation unavailable'));return}setStatus('v57Status','📍 現在地を取得しています…','busy');navigator.geolocation.getCurrentPosition(async pos=>{try{const t=getTrip();if(!t)throw new Error('旅行がありません');const c=load(t);c.originLat=pos.coords.latitude;c.originLon=pos.coords.longitude;const label=await reverse(c.originLat,c.originLon);c.origin=label?label.split(',').slice(0,3).join(', '):'現在地';saveCfg(t,c);const o=document.getElementById('v57Origin');if(o)o.value=c.origin;const la=document.getElementById('v57OriginLat');if(la)la.value=c.originLat;const lo=document.getElementById('v57OriginLon');if(lo)lo.value=c.originLon;setStatus('v57Status','✅ 現在地を出発地点に設定しました。','ok');if(typeof toast==='function')toast('現在地を出発地点に設定しました');resolve(c)}catch(e){setStatus('v57Status','⚠️ 現在地の住所を設定できませんでした。','err');reject(e)}},err=>{setStatus('v57Status','⚠️ 現在地を取得できませんでした。位置情報の許可を確認してください。','err');reject(err)}, {enableHighAccuracy:true,timeout:10000,maximumAge:300000})})};
  window.v57AutoRoute=autoRoute;
  window.v57Save=function(closeAfter){const t=getTrip();if(!t)return;const c=saveFromUI();renderResults(c);const d=selected(t,c);updateMaps(c,d.first,d.last);if(typeof toast==='function')toast(closeAfter?'出発・帰宅設定を保存しました':'設定を保存しました');if(closeAfter)closeModal()};
  window.openDeparturePlanV56=function(){
    const t=getTrip();if(!t){if(typeof openTripModal==='function')openTripModal();return}const ps=plans(t);if(!ps.length){openModal(`<div class="modal-head"><h2>🚗 出発・帰宅計画</h2><button class="close" onclick="closeModal()">×</button></div><div class="empty"><div>🗓️</div><p>まず旅行の日程に最初の予定を追加してください。</p><button class="btn full" onclick="closeModal();switchPage('plan')">旅程を作る</button></div>`);return}
    const c=load(t),d=selected(t,c);c.origin=c.origin||'';c.buffer=c.buffer??15;c.arrivalTime=c.arrivalTime||d.first?.time||'10:00';c.returnLeaveTime=c.returnLeaveTime||d.last?.time||'17:00';c.outboundDuration=c.outboundDuration||'';c.returnDuration=c.returnDuration||'';
    const out=cfgTimes(c).out,ret=cfgTimes(c).ret;const origin=c.origin||'';
    openModal(`<div class="modal-head"><h2>🚗 出発・帰宅計画</h2><button class="close" onclick="closeModal()">×</button></div>
      <div class="v57-intro"><b>✨ 移動手段を選んで出発・帰宅を計画</b><p class="small" id="v57ModeNote">道路ルートから車の推定所要時間・距離を自動取得します。</p><p class="small">現在地はボタンを押したときだけ取得します。公共交通はGoogle Mapsで電車・バス・新幹線を含む最新の乗換・時刻を確認できます。</p></div><div class="v56-route-card"><h3>🧭 移動手段</h3><div class="v57-mode-grid"><button type="button" class="btn secondary v57-mode" data-v57-mode="car" onclick="applyTransportMode('car')">🚗 車</button><button type="button" class="btn secondary v57-mode" data-v57-mode="trainbus" onclick="applyTransportMode('trainbus')">🚆 電車・バス</button><button type="button" class="btn secondary v57-mode" data-v57-mode="shinkansen" onclick="applyTransportMode('shinkansen')">🚄 新幹線</button></div></div>
      <div class="v56-route-card"><h3>📍 出発する場所</h3><input id="v57Origin" class="field" value="${esc57(origin)}" placeholder="例：愛知県刈谷市、名古屋駅、自宅など"><input type="hidden" id="v57OriginLat" value="${esc57(c.originLat||'')}"><input type="hidden" id="v57OriginLon" value="${esc57(c.originLon||'')}"><div class="grid" style="margin-top:10px"><button class="btn secondary full" onclick="v57UseCurrentLocation()">📍 現在地を使う</button><button class="btn secondary full" onclick="v57AutoRoute('all')">🔄 行き・帰りを自動取得</button></div></div>
      <div class="v56-route-card"><h3>🛣️ 行き：出発 → 最初の目的地</h3><div class="group"><label>最初の目的地</label><select id="v57First" class="field">${options(ps,d.first?.id)}</select></div><div class="v57-grid"><div><label>到着したい時刻</label><input id="v57Arrival" class="field" type="time" value="${esc57(c.arrivalTime)}"></div><div><label>余裕時間</label><select id="v57Buffer" class="field"><option value="0" ${Number(c.buffer)===0?'selected':''}>0分</option><option value="15" ${Number(c.buffer)===15?'selected':''}>15分</option><option value="30" ${Number(c.buffer)===30?'selected':''}>30分</option><option value="45" ${Number(c.buffer)===45?'selected':''}>45分</option><option value="60" ${Number(c.buffer)===60?'selected':''}>60分</option></select></div></div><div class="v57-auto-row"><div><label>自動取得した所要時間</label><input id="v57OutDur" class="field" type="number" min="1" value="${esc57(c.outboundDuration)}" placeholder="自動取得"><span class="v57-unit">分</span></div><div><label>距離</label><input id="v57OutKm" class="field" value="${esc57(c.outboundKm||'')}" readonly placeholder="自動取得"><span class="v57-unit">km</span></div></div><div id="v57OutResult" class="v57-calc">${out===null?'「自動取得」で所要時間を計算します':`おすすめ出発時刻：<strong>${fromMin(out)}</strong>`}</div><div class="grid" style="margin-top:10px"><button class="btn full" onclick="v57AutoRoute('out')">🚗 行きの所要時間を自動取得</button><a id="v57OutMap" class="btn secondary full" target="_blank" rel="noopener" href="${origin&&spotName(d.first)?mapUrl(origin,spotName(d.first)):'#'}">🗺️ Google Mapsで確認</a></div></div>
      <div class="v56-route-card"><h3>🏠 帰り：最後の目的地 → 出発地点</h3><div class="group"><label>最後の目的地</label><select id="v57Last" class="field">${options(ps,d.last?.id)}</select></div><div class="v57-grid"><div><label>最後の目的地を出る時刻</label><input id="v57ReturnLeave" class="field" type="time" value="${esc57(c.returnLeaveTime)}"></div><div><label>移動の余裕</label><select class="field" disabled><option>行きと同じ考え方</option></select></div></div><div class="v57-auto-row"><div><label>自動取得した所要時間</label><input id="v57RetDur" class="field" type="number" min="1" value="${esc57(c.returnDuration)}" placeholder="自動取得"><span class="v57-unit">分</span></div><div><label>距離</label><input id="v57RetKm" class="field" value="${esc57(c.returnKm||'')}" readonly placeholder="自動取得"><span class="v57-unit">km</span></div></div><div id="v57RetResult" class="v57-calc">${ret===null?'「自動取得」で所要時間を計算します':`自宅到着予定：<strong>${fromMin(ret)}</strong>`}</div><div class="grid" style="margin-top:10px"><button class="btn full" onclick="v57AutoRoute('ret')">🏠 帰りの所要時間を自動取得</button><a id="v57RetMap" class="btn secondary full" target="_blank" rel="noopener" href="${origin&&spotName(d.last)?mapUrl(spotName(d.last),origin):'#'}">🗺️ Google Mapsで確認</a></div></div>
      </div><div id="v57TransitTools" class="v56-route-card" style="display:none"><h3>🚆 公共交通でルートを確認</h3><p class="small">電車・バス・新幹線は、出発地点と目的地をもとにGoogle Mapsの公共交通ルートを開きます。出発時刻に合わせた乗換案内・所要時間・運賃などを確認できます。</p><div class="grid" style="margin-top:10px"><button class="btn full" onclick="openTransitRoute('out')">🚆 行きの乗換案内を開く</button><button class="btn full" onclick="openTransitRoute('ret')">🏠 帰りの乗換案内を開く</button></div></div><div id="v57Status" class="v57-status">💡 「行き・帰りを自動取得」を押すと、両方をまとめて計算します。</div><button class="btn secondary full" onclick="v57Save(true)">💾 出発・帰宅設定を保存</button>`);
  };
})();
</script>

<script>
/* =========================
   V60 出発・帰宅計画を旅行プラン画面へ常設
   - 現在地 / 登録した出発地点を使う
   - 最初の目的地までの距離・推定時間
   - 最後の目的地から出発地点までの距離・推定時間
   - 到着希望時刻から出発時刻を逆算
   - 最後の目的地を出る時刻から帰宅予定時刻を逆算
   - 既存のV57モーダルを入口として利用（機能は削除しない）
========================= */
(function(){
  function routeCfg(){try{const t=typeof trip==='function'?trip():null;if(!t)return null;return JSON.parse(localStorage.getItem('travel_note_departure_plan_v56_'+t.id)||'{}')}catch(e){return{}}}
  function plans(){const t=typeof trip==='function'?trip():null;return (t?.plans||[]).filter(p=>p.date||p.time).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||''))||(a.order??0)-(b.order??0))}
  function esc2(x){return typeof esc==='function'?esc(x):String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function fmt(min){min=Number(min);if(!Number.isFinite(min)||min<=0)return '未計算';const h=Math.floor(min/60),m=Math.round(min%60);return h?`${h}時間${m?m+'分':''}`:`${m}分`}
  function fmtClock(hm){const m=String(hm||'').match(/^(\d{1,2}):([0-5]\d)$/);return m?m[0]:'未設定'}
  function calc(){const c=routeCfg()||{},a=String(c.arrivalTime||''),b=String(c.returnLeaveTime||'');const am=a.match(/^(\d{1,2}):([0-5]\d)$/),bm=b.match(/^(\d{1,2}):([0-5]\d)$/);let out='未計算',ret='未計算';if(am&&Number(c.outboundDuration)>0){let n=Number(am[1])*60+Number(am[2])-Number(c.outboundDuration)-Number(c.buffer||0);n=(n%1440+1440)%1440;out=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}if(bm&&Number(c.returnDuration)>0){let n=Number(bm[1])*60+Number(bm[2])+Number(c.returnDuration);n=(n%1440+1440)%1440;ret=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}return {out,ret}}
  window.renderDepartureRouteSummary=function(){
    const el=document.getElementById('departureRouteSummary');if(!el)return;const ps=plans();const c=routeCfg();
    if(!ps.length){el.innerHTML=`<div class="v60-route-summary"><div class="v60-route-summary-head"><div><h3>🧭 出発・帰宅計画</h3><p>車・電車・バス・新幹線から移動手段を選び、出発時刻と帰宅予定を計画できます。</p></div></div><div class="v60-route-actions"><button class="btn" type="button" onclick="openDeparturePlanV56()">出発・帰宅を計画</button></div><div class="v60-route-note">まず旅程に予定を1件追加すると、最初の目的地・最後の目的地を選んで自動計算できます。</div></div>`;return}
    const first=ps[0],last=ps[ps.length-1],cc=c||{},hasOrigin=!!(cc.origin||cc.originLat||cc.originLon),ct=calc();
    el.innerHTML=`<div class="v60-route-summary"><div class="v60-route-summary-head"><div><h3>🧭 出発・帰宅計画</h3><p>${hasOrigin?'出発地点を設定済みです。':'現在地を取得するか、出発地点を入力してください。'} 所要時間は道路ルートから自動計算できます。</p></div><button class="btn secondary" type="button" onclick="openDeparturePlanV56()">詳細</button></div><div class="v60-route-grid"><div class="v60-route-stat"><span class="label">🧭 移動手段</span><strong>${transportLabel(transportMode(cc))}</strong></div><div class="v60-route-stat"><span class="label">📍 出発地点</span><strong>${esc2(cc.origin||'未設定')}</strong></div><div class="v60-route-stat"><span class="label">🎯 最初の目的地</span><strong>${esc2((typeof spotFor==='function'&&spotFor(first)?.name)||first.title||'未設定')}</strong></div><div class="v60-route-stat"><span class="label">🛣️ 行き</span><strong>${cc.outboundKm?esc2(cc.outboundKm)+' km / ':''}${fmt(cc.outboundDuration)}</strong></div><div class="v60-route-stat"><span class="label">🏠 帰り</span><strong>${cc.returnKm?esc2(cc.returnKm)+' km / ':''}${fmt(cc.returnDuration)}</strong></div></div><div class="v60-route-actions"><button class="btn" type="button" onclick="openDeparturePlanV56()">🧭 出発・帰宅を計画</button><button class="btn secondary" type="button" onclick="v57UseCurrentLocation().then(()=>v57AutoRoute('all')).catch(()=>{})">📍 現在地を更新して再計算</button></div><div class="v60-route-note">おすすめ出発時刻：<b>${ct.out}</b>　／　自宅到着予定：<b>${ct.ret}</b><br>※${transportLabel(transportMode(cc))}。公共交通はGoogle Mapsで最新の時刻・乗換を確認できます。</div></div>`;
  };
  const oldRenderAll=window.renderAll;
  if(typeof oldRenderAll==='function')window.renderAll=function(){oldRenderAll();setTimeout(()=>{try{window.renderDepartureRouteSummary()}catch(e){}},0)};
  setTimeout(()=>{try{window.renderDepartureRouteSummary()}catch(e){}},100);
})();
</script>

<script>
/* =========================
   V58 整理版・旅コンシェルジュ候補センター
   - V55の機能を削除せず、入口を一つの整理された画面に集約
   - data-action + document delegationでタップ反応を安定化
   - 観光 / グルメ / カフェ / ホテルを同じ画面で切替
   - 「行きたい」「この旅行に追加」を確実に実行
========================= */
(function(){
  const iconMap={観光:'📍',グルメ:'🍴',カフェ:'☕',ホテル:'🏨'};
  const esc58=s=>typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function currentTrip(){try{return typeof trip==='function'?trip():null}catch(e){return null}}
  function list(pref){return (typeof RECOMMEND_V55!=='undefined'&&RECOMMEND_V55[pref])||[]}
  function dates(t){if(!t||!t.startDate||!t.endDate)return[];const a=[];let d=new Date(t.startDate+'T00:00:00'),e=new Date(t.endDate+'T00:00:00');for(;d<=e;d.setDate(d.getDate()+1))a.push(d.toISOString().slice(0,10));return a}
  function extLinks(pref,genre){
    const q=encodeURIComponent(pref+' '+genre+' おすすめ');
    const mq=encodeURIComponent(pref+' '+genre);
    return `<div class="v58-search-grid"><a class="v58-search" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${mq}">🗺️ Google Mapsで探す</a><a class="v58-search" target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}">🌐 Webで探す</a></div>`;
  }
  function render(pref,genre='観光',advance=false){
    if(!pref){if(typeof toast==='function')toast('行き先の都道府県を選択してください');return}
    if(typeof v55SetGenre==='function')v55SetGenre(genre);
    let arr=list(pref);
    if(advance && arr.length && typeof v55Visible==='function'){
      arr=v55Visible(pref,true);
    }else if(arr.length && typeof v55Visible==='function'){
      arr=v55Visible(pref,false);
    }
    const t=currentTrip();
    const ds=dates(t); const defaultDate=ds[0]||new Date().toISOString().slice(0,10);
    const registered=new Set((data.spots||[]).map(s=>s.name));
    const genreButtons=['観光','グルメ','カフェ','ホテル'].map(g=>`<button type="button" class="v58-genre ${g===genre?'on':''}" data-v58-action="genre" data-pref="${esc58(pref)}" data-genre="${esc58(g)}">${iconMap[g]} ${g}</button>`).join('');
    let content='';
    if(genre==='観光'){
      content=arr.length?`<div class="v58-list">${arr.map(r=>{
        const exists=registered.has(r[0]);
        return `<div class="v58-item"><div class="v58-icon">${r[2]}</div><div><div class="v58-name">${esc58(r[0])}</div><span class="v58-desc">${esc58(r[1])}</span><div class="v58-actions">${exists?`<span class="v58-pill">✓ 行きたいに登録済み</span>`:`<button type="button" class="v58-action primary" data-v58-action="add-fav" data-pref="${esc58(pref)}" data-name="${esc58(r[0])}">＋ 行きたいに追加</button>`}${t?`<button type="button" class="v58-action" data-v58-action="add-plan" data-pref="${esc58(pref)}" data-name="${esc58(r[0])}">🗓 この旅行に追加</button>`:''}</div></div></div>`}).join('')}</div>`:`<div class="v58-help">この都道府県の登録候補はありません。外部検索から探せます。</div>`;
      content+=`<div class="v58-actions" style="margin-top:12px"><button type="button" class="v58-action v58-refresh" data-v58-action="refresh" data-pref="${esc58(pref)}">🔄 別の候補を見る</button></div>`;
    }else{
      content=`<p class="v58-help">${esc58(pref)}の${esc58(genre)}を探します。最新の店舗・営業状況は外部検索で確認できます。</p>${extLinks(pref,genre)}`;
    }
    const planBox=t?`<div class="v58-planbox"><b>🗓 旅行への追加先</b><div class="row" style="margin-top:8px"><select id="v58Date" class="field">${ds.map(d=>`<option value="${d}">${d}</option>`).join('')||`<option value="${defaultDate}">${defaultDate}</option>`}</select><input id="v58Time" type="time" class="field" value="15:00"></div><p class="small" style="margin:7px 0 0">候補の「この旅行に追加」を押すと、ここで選んだ日時に旅程へ追加します。</p></div>`:'';
    openModal(`<div class="modal-head"><h2>✨ 旅コンシェルジュ</h2><button class="close" onclick="closeModal()">×</button></div><div class="v58-center"><div class="v58-section"><h3>① 行き先</h3><p class="v58-help">都道府県を1つ選ぶだけで、観光・グルメ・カフェ・ホテルをここからまとめて探せます。</p><select id="v58Pref" class="field" data-v58-action="pref-change">${PREF.map(p=>`<option value="${esc58(p)}" ${p===pref?'selected':''}>${esc58(p)}</option>`).join('')}</select></div><div class="v58-section"><h3>② 探したいもの</h3><div class="v58-genre-grid">${genreButtons}</div></div><div class="v58-section"><h3>③ ${esc58(pref)}のおすすめ</h3>${content}</div>${planBox}<div class="v58-section"><h3>④ 旅程を整える</h3><p class="v58-help">追加した候補は「行きたい場所」に保存され、旅行プラン作成や旅程診断など他の機能でも利用できます。</p><div class="v58-summary"><span class="v58-pill">📍 行きたい場所</span><span class="v58-pill">🗓 旅行日程</span><span class="v58-pill">✨ 旅行プラン</span></div></div><div class="v55-note">営業時間・料金・休館日などは訪問前に公式情報をご確認ください。</div></div>`);
    const prefEl=document.getElementById('v58Pref');
    if(prefEl)prefEl.addEventListener('change',()=>{const p=prefEl.value;if(p)render(p,genre,false)});
  }
  function addFav(pref,name){
    const r=list(pref).find(x=>x[0]===name);if(!r)return;
    let s=data.spots.find(x=>x.name===name);
    if(s){s.favorite=true;save();if(typeof toast==='function')toast('すでに登録済みの場所を「行きたい」にしました');render(pref,'観光',false);return}
    data.spots.unshift({id:eid('spot'),name:r[0],prefecture:pref,category:'c1',address:'',description:r[1],oneLine:'行きたい！',memo:'',lat:'',lon:'',image:'',priority:4,favorite:true,visited:false});
    try{localStorage.setItem('travel_note_last_reco_pref_v55',pref)}catch(e){}
    save();if(typeof toast==='function')toast(name+'を「行きたい」に追加しました');render(pref,'観光',false);
  }
  function addPlan(pref,name){
    const r=list(pref).find(x=>x[0]===name);if(!r)return;
    const t=currentTrip();if(!t){if(typeof toast==='function')toast('先に旅行を作成してください');return}
    let s=data.spots.find(x=>x.name===name);
    if(!s){s={id:eid('spot'),name:r[0],prefecture:pref,category:'c1',address:'',description:r[1],oneLine:'旅程候補',memo:'',lat:'',lon:'',image:'',priority:4,favorite:true,visited:false};data.spots.unshift(s)}else{s.favorite=true}
    const ds=dates(t);const date=document.getElementById('v58Date')?.value||ds[0]||new Date().toISOString().slice(0,10);const time=document.getElementById('v58Time')?.value||'15:00';
    t.plans=t.plans||[];t.plans.push({id:eid('plan'),spotId:s.id,title:s.name,date,time,cost:0,memo:'旅コンシェルジュのおすすめから追加',done:false,order:t.plans.length,transport:t.preferences?.transport||'未設定',expenseCategory:'観光'});
    save();if(typeof toast==='function')toast(name+'を旅程に追加しました');render(pref,'観光',false);
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-v58-action]');if(!b)return;
    const a=b.getAttribute('data-v58-action'),pref=b.getAttribute('data-pref'),genre=b.getAttribute('data-genre'),name=b.getAttribute('data-name');
    if(a==='genre'){e.preventDefault();render(pref,genre,false)}
    else if(a==='refresh'){e.preventDefault();render(pref,'観光',true);if(typeof toast==='function')toast('おすすめ候補を更新しました')}
    else if(a==='add-fav'){e.preventDefault();addFav(pref,name)}
    else if(a==='add-plan'){e.preventDefault();addPlan(pref,name)}
  });
  window.v55Render=function(pref,genre='観光',advance=false,title){render(pref,genre,advance)};
  window.v55PrefChanged=function(){const p=document.getElementById('v58Pref')?.value;if(p)render(p,'観光',false)};
  window.v55ChooseGenre=function(pref,genre){render(pref,genre,false)};
  window.v55Refresh=function(pref,genre){render(pref,genre||'観光',true);if(typeof toast==='function')toast('おすすめ候補を更新しました')};
  window.v55ExploreRefresh=function(){const p=document.getElementById('recommendPref')?.value;if(p)render(p,'観光',true);else if(typeof toast==='function')toast('都道府県を選択してください')};
  window.showRecommendations=function(){const p=document.getElementById('recommendPref')?.value;if(p)render(p,'観光',false);else if(typeof toast==='function')toast('都道府県を選択してください')};
  window.openDestinationGuide=function(){
    const t=currentTrip();let pref='';const d=String(t?.destination||'').trim();
    if(PREF.includes(d))pref=d;else{const f=PREF.find(p=>d.includes(p.replace(/都|府|県$/,'')));if(f)pref=f}
    if(!pref)pref=PREF.includes(localStorage.getItem('travel_note_last_reco_pref_v55'))?localStorage.getItem('travel_note_last_reco_pref_v55'):'東京都';
    render(pref,'観光',false);
  };
})();
</script>
